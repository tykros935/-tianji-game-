/* =====================================================================
   v1.3.0 · 前端 UI 磨砂玻璃（Glassmorphism）
   ---------------------------------------------------------------------
   设计取色仍留在原本的宣纸/朱砂/青瓷/金 体系内，不做通用 Apple 玻璃，
   避免变成另一款游戏。
   性能约束：真 backdrop-filter 只给「大面板」，且同一屏最多 4 片；
            小控件一律用伪玻璃（半透明 + 内高光），不产生额外合成层。
            转盘 SVG 的祖先链上绝不挂任何 filter。
   ===================================================================== */
:root{
  --glass:rgba(255,255,255,.40);
  --glass-hi:rgba(255,255,255,.54);
  --glass-line:rgba(255,255,255,.74);
  --glass-edge:rgba(122,112,92,.12);
  --glass-shadow:0 10px 30px rgba(90,78,55,.10);
  --glass-inset:inset 0 1px 0 rgba(255,255,255,.92);
  --glass-blur:18px;
}

/* ---- 背景层：玻璃的"内容" ---- */
#bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(52% 34% at 8% 2%,   rgba(226,64,58,.34),   transparent 66%),
    radial-gradient(46% 30% at 94% 4%,  rgba(206,166,84,.38),  transparent 68%),
    radial-gradient(52% 34% at 90% 94%, rgba(86,138,130,.32),  transparent 70%),
    radial-gradient(46% 30% at 2% 96%,  rgba(150,118,86,.28),  transparent 72%),
    radial-gradient(40% 26% at 50% 52%, rgba(255,255,255,.55), transparent 72%),
    linear-gradient(160deg,#FAF6ED 0%,#F1EADB 45%,#E7DDCA 100%);
  box-shadow:inset 0 0 140px rgba(120,104,78,.10);
}
#app{position:relative;z-index:1}

/* ---- 标题：轻玻璃 ---- */
#titleText{
  background:var(--glass-hi);
  background-image:linear-gradient(135deg,rgba(255,255,255,.70) 0%,rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 62%);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(12px) saturate(1.3);
          backdrop-filter:blur(12px) saturate(1.3);
  box-shadow:var(--glass-shadow),var(--glass-inset);
}

/* ---- HUD 胶囊：伪玻璃（不模糊） ---- */
.hudItem{
  background:rgba(255,255,255,.44);
  border:1px solid rgba(255,255,255,.60);
  box-shadow:0 2px 8px rgba(90,78,55,.07),inset 0 1px 0 rgba(255,255,255,.85);
}

/* ---- 叙事框：真玻璃 ---- */
#sayBox{
  background:var(--glass);
  background-image:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.08) 42%,rgba(255,255,255,0) 64%);
  border:1px solid var(--glass-line);
  border-radius:18px;
  margin:4px 0;
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.35);
          backdrop-filter:blur(var(--glass-blur)) saturate(1.35);
  box-shadow:var(--glass-shadow),var(--glass-inset);
}

/* ---- 主按钮：玻璃 + 朱砂投影 ---- */
#spinBtn{
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 10px 26px rgba(229,67,61,.17),0 1px 0 rgba(120,110,90,.06),inset 0 1px 0 rgba(255,255,255,.96);
}
#spinBtn.ready:active{transform:scale(.97)}

/* ---- 次按钮：伪玻璃 ---- */
.opSide,.opSide.sel,#rerollBtn{
  background:rgba(255,255,255,.50);
  border:1px solid rgba(255,255,255,.66);
  color:#5F594B;
  box-shadow:0 3px 10px rgba(90,78,55,.08),inset 0 1px 0 rgba(255,255,255,.86);
}
.opSide:active,.opSide.sel:active,#rerollBtn:active{transform:scale(.96)}
.opSide.on,.opSide.sel.on{
  background:rgba(58,58,58,.88);
  border-color:rgba(58,58,58,.92);
  color:#FFF;
  box-shadow:0 4px 14px rgba(40,36,30,.22),inset 0 1px 0 rgba(255,255,255,.14);
}
#rerollBtn{background:rgba(255,251,235,.62);border-color:rgba(217,199,122,.72);color:#8A6D1F}
#rerollBtn.ready{box-shadow:0 4px 14px rgba(217,199,122,.45),inset 0 1px 0 rgba(255,255,255,.9)}

/* ---- 属性面板 / 播报面板：真玻璃 ---- */
#panel,#logPanel{
  background:rgba(255,255,255,.50);
  background-image:linear-gradient(135deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.06) 38%,rgba(255,255,255,0) 58%);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.35);
          backdrop-filter:blur(var(--glass-blur)) saturate(1.35);
  box-shadow:var(--glass-shadow),var(--glass-inset);
}
#pTitle{border-bottom-color:rgba(122,112,92,.18)}

/* ---- 浮层卡片：厚玻璃 ---- */
#endCard,#logCard{
  background:var(--glass-hi);
  background-image:linear-gradient(135deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.10) 38%,rgba(255,255,255,0) 58%);
  border:1px solid rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(24px) saturate(1.42);
          backdrop-filter:blur(24px) saturate(1.42);
  box-shadow:0 18px 52px rgba(70,60,40,.18),inset 0 1px 0 rgba(255,255,255,.95);
}
/* 结束浮层：轻模糊压掉底层日志文字（此时转盘已静止，模糊结果可缓存，不产生逐帧开销） */
#overlay{
  background:rgba(247,243,234,.80);
  -webkit-backdrop-filter:blur(10px) saturate(1.08);
          backdrop-filter:blur(10px) saturate(1.08);
}
#logOverlay{background:rgba(247,243,234,.92)}

/* ---- 分享按钮 ---- */
#shareGameBtn,#shareRunBtn{
  background:rgba(255,255,255,.52);
  border:1px solid rgba(255,255,255,.68);
  box-shadow:0 3px 10px rgba(90,78,55,.07),inset 0 1px 0 rgba(255,255,255,.86);
  min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;
}

/* ---- 滚动条：细一点，别破坏玻璃感 ---- */
#sayBox::-webkit-scrollbar,#logPanel::-webkit-scrollbar,#endChron::-webkit-scrollbar{width:6px}
#sayBox::-webkit-scrollbar-thumb,#logPanel::-webkit-scrollbar-thumb,#endChron::-webkit-scrollbar-thumb{
  background:rgba(122,112,92,.24);border-radius:3px;
}
#sayBox::-webkit-scrollbar-track,#logPanel::-webkit-scrollbar-track,#endChron::-webkit-scrollbar-track{background:transparent}

/* ---- 键盘可达性 ---- */
button:focus-visible,select:focus-visible,input:focus-visible{
  outline:2px solid rgba(229,67,61,.55);outline-offset:2px;
}

/* ---- 兜底一：浏览器不支持 backdrop-filter ---- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #titleText,#sayBox,#panel,#logPanel,#endCard,#logCard{background:rgba(255,255,255,.88)}
}

/* ---- 兜底二：低配设备（JS 打 perf-low）/ 系统要求减少透明 ---- */
html.perf-low #titleText,
html.perf-low #sayBox,
html.perf-low #panel,
html.perf-low #logPanel,
html.perf-low #endCard,
html.perf-low #logCard{
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:rgba(255,255,255,.88);
}
@media (prefers-reduced-transparency:reduce){
  #titleText,#sayBox,#panel,#logPanel,#endCard,#logCard{
    -webkit-backdrop-filter:none;backdrop-filter:none;
    background:rgba(255,255,255,.90);
  }
}

/* =====================================================================
   v1.3.0 · 结局战报画面
   ---------------------------------------------------------------------
   1) 玻璃更通透：降低填充不透明度、加大 blur 与 saturate，让身后模糊的
      转盘色彩真正透上来；靠"边缘高光 + 斜切反光"维持边界感，而不是靠白底。
   2) 两个按钮加互动：悬停抬升 + 内光晕 + 斜切扫光 + 按下回弹。
      动效只用 transform / opacity（伪元素承载），不触碰布局属性。
   3) 入场层次：卡片淡入 + 子元素逐个上浮，阅读顺序自然。
   ===================================================================== */
#overlay{
  background:rgba(247,243,234,.62);
  -webkit-backdrop-filter:blur(18px) saturate(1.22);
          backdrop-filter:blur(18px) saturate(1.22);
}
#endCard{
  position:relative;
  background:rgba(255,255,255,.34);
  background-image:
    linear-gradient(152deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 30%,rgba(255,255,255,0) 48%),
    radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.28),rgba(255,255,255,0) 62%);
  border:1px solid rgba(255,255,255,.76);
  -webkit-backdrop-filter:blur(32px) saturate(1.6);
          backdrop-filter:blur(32px) saturate(1.6);
  box-shadow:
    0 30px 80px rgba(70,60,40,.20),
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,255,255,.34);
  animation:endCardIn .30s ease-out backwards;
}
@keyframes endCardIn{from{opacity:0}to{opacity:1}}

/* 子元素逐个上浮（transform/opacity，不触发重排） */
@keyframes endItemIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
#endCard > *{animation:endItemIn .40s cubic-bezier(.2,.9,.3,1) backwards}
#endCard > *:nth-child(1){animation-delay:.05s}
#endCard > *:nth-child(2){animation-delay:.09s}
#endCard > *:nth-child(3){animation-delay:.13s}
#endCard > *:nth-child(4){animation-delay:.17s}
#endCard > *:nth-child(5){animation-delay:.21s}
#endCard > *:nth-child(6){animation-delay:.25s}
#endCard > *:nth-child(7){animation-delay:.29s}
#endCard > *:nth-child(8){animation-delay:.33s}
#endCard > *:nth-child(9){animation-delay:.37s}
#endCard > *:nth-child(10){animation-delay:.40s}

/* 结局标题：墨色到金的渐变字，落在玻璃上更立体 */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  #endTitle{
    background-image:linear-gradient(180deg,#2B2620 0%,#55482F 58%,#9A7A24 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:none;
  }
}

/* ---- 两个按钮的共用互动骨架 ---- */
#shareRunBtn,#restartBtn{
  position:relative;isolation:isolate;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  width:100%;max-width:280px;margin:16px auto 0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .18s cubic-bezier(.2,1.3,.4,1),
             box-shadow .24s ease, border-color .24s ease, opacity .2s;
}
#shareRunBtn::before,#restartBtn::before,
#shareRunBtn::after,#restartBtn::after{
  content:'';position:absolute;pointer-events:none;border-radius:inherit;z-index:-1;
}
/* 悬停内光晕 */
#shareRunBtn::before,#restartBtn::before{
  inset:-45%;opacity:0;transition:opacity .3s ease;
  background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);
}
/* 斜切扫光 */
#shareRunBtn::after,#restartBtn::after{
  top:-60%;left:-85%;width:55%;height:220%;opacity:0;
  transform:rotate(16deg) translateX(0);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.50),rgba(255,255,255,0));
  transition:transform .62s cubic-bezier(.3,.7,.3,1),opacity .34s ease;
}
@media (hover:hover) and (pointer:fine){
  #shareRunBtn:hover,#restartBtn:hover{transform:translateY(-2px)}
  #shareRunBtn:hover::before,#restartBtn:hover::before{opacity:1}
  #shareRunBtn:hover::after,#restartBtn:hover::after{opacity:1;transform:rotate(16deg) translateX(430%)}
}
#shareRunBtn:active,#restartBtn:active{transform:translateY(0) scale(.965)}
#shareRunBtn:focus-visible,#restartBtn:focus-visible{
  outline:2px solid rgba(229,67,61,.6);outline-offset:3px;
}

/* ---- 分享本局战报：通透次级玻璃 ---- */
#shareRunBtn{
  min-height:46px;border-radius:999px;
  border:1px solid rgba(255,255,255,.80);
  background:rgba(255,255,255,.40);
  background-image:linear-gradient(160deg,rgba(255,255,255,.66),rgba(255,255,255,.12) 64%);
  -webkit-backdrop-filter:blur(14px) saturate(1.35);
          backdrop-filter:blur(14px) saturate(1.35);
  color:#544C3E;font-size:14px;font-weight:800;letter-spacing:2px;
  box-shadow:0 8px 22px rgba(80,70,50,.12),inset 0 1px 0 rgba(255,255,255,.94);
}
@media (hover:hover) and (pointer:fine){
  #shareRunBtn:hover{
    border-color:rgba(255,255,255,.98);
    box-shadow:0 12px 28px rgba(80,70,50,.16),inset 0 1px 0 rgba(255,255,255,.99);
  }
}

/* ---- 再来一次：墨玉主按钮 ---- */
#restartBtn{
  min-height:52px;border-radius:999px;
  border:1px solid rgba(255,255,255,.20);
  background-color:rgba(44,40,33,.92);
  background-image:
    linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 44%),
    linear-gradient(180deg,rgba(64,58,48,.94),rgba(32,29,24,.92));
  color:#FFF;font-size:16px;font-weight:800;letter-spacing:4px;
  box-shadow:0 14px 30px rgba(38,32,22,.30),inset 0 1px 0 rgba(255,255,255,.22);
}
@media (hover:hover) and (pointer:fine){
  #restartBtn:hover{
    box-shadow:
      0 18px 38px rgba(38,32,22,.34),
      0 0 0 1px rgba(206,166,84,.34),
      0 0 26px rgba(206,166,84,.22),
      inset 0 1px 0 rgba(255,255,255,.26);
  }
}
#restartBtn::after{
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.30),rgba(255,255,255,0));
}

/* 状态提示紧贴分享按钮，别把两个按钮撑开 */
#endShareStatus{min-height:0;padding:6px 6px 0}

/* 无障碍：尊重减少动效 */
@media (prefers-reduced-motion:reduce){
  #endCard,#endCard > *{animation:none}
  #shareRunBtn,#restartBtn,
  #shareRunBtn::before,#shareRunBtn::after,
  #restartBtn::before,#restartBtn::after{transition:none}
  #shareRunBtn:hover,#restartBtn:hover{transform:none}
}

/* ---- 通透度终调（覆盖前值，置于末尾确保生效） ---- */
#overlay{background:rgba(247,243,234,.56)}
#endCard{
  background:rgba(255,255,255,.25);

    linear-gradient(152deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,.08) 34%,rgba(255,255,255,0) 52%),
    radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);
}

/* ---- 按钮通透度终调：主按钮改墨玉玻璃，次按钮再透一档 ---- */
#shareRunBtn{
  background:rgba(255,255,255,.34);

}
#restartBtn{
  background-color:rgba(42,38,31,.74);
  background-image:
    linear-gradient(160deg,rgba(255,255,255,.20),rgba(255,255,255,0) 46%),
    linear-gradient(180deg,rgba(64,58,48,.80),rgba(30,27,22,.76));
  -webkit-backdrop-filter:blur(12px) saturate(1.25);
          backdrop-filter:blur(12px) saturate(1.25);
  border-color:rgba(255,255,255,.26);
}

/* ================= 天机一转 · 星盘主题 ================= */
.theme-star{
  --paper:#080B14;--paper2:#0E1422;--card:#151B2B;
  --ink:#E6DED0;--faint:#9A927F;--line:rgba(212,175,55,.22);
  --ink-faint:#7F7868;--ink-dim:#9A927F;
  --glass:rgba(21,27,43,.55);--glass-hi:rgba(28,36,56,.80);
  --glass-line:rgba(212,175,55,.30);--glass-edge:rgba(212,175,55,.12);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45);
  --glass-inset:inset 0 1px 0 rgba(212,175,55,.10);
  --gold:#D4AF37;--gold-hi:#E8C56A;--gold-soft:rgba(212,175,55,.14);
  --ok:#5FA88F;--danger:#C9544A;--blue:#5B7FB8;--purple:#6B4E8C;
  --f-title:'Songti SC','STSong','SimSun',serif;
  --f-num:'SF Mono','Consolas','Menlo',monospace;
  color-scheme:dark;
}
.theme-star body{background:var(--paper);color:var(--ink)}

/* —— 背景：星云 —— */
.theme-star #bg{
  background:
    radial-gradient(46% 30% at 16% 8%, rgba(91,127,184,.18), transparent 68%),
    radial-gradient(40% 26% at 86% 12%, rgba(212,175,55,.16), transparent 70%),
    radial-gradient(50% 32% at 78% 92%, rgba(107,78,140,.18), transparent 72%),
    radial-gradient(44% 28% at 10% 90%, rgba(95,168,143,.10), transparent 72%),
    radial-gradient(60% 40% at 50% 50%, rgba(255,255,255,.03), transparent 70%),
    linear-gradient(165deg,#0B0F1A 0%,#101728 46%,#0A0D16 100%);
  box-shadow:none;
}

/* —— 标题：金线夹宋体 —— */
.theme-star #titleText{
  background:transparent;border:none;box-shadow:none;border-radius:0;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  color:var(--gold-hi);font-family:var(--f-title);
  font-size:20px;letter-spacing:8px;padding:10px 0 4px;position:relative;
}
.theme-star #titleText::before,.theme-star #titleText::after{
  content:'';position:absolute;top:52%;width:34px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
}
.theme-star #titleText::before{right:100%;margin-right:16px;transform:scaleX(-1)}
.theme-star #titleText::after{left:100%;margin-left:16px}
.theme-star #verTag{margin-left:52px;color:var(--gold);border-color:rgba(212,175,55,.3);background:transparent;letter-spacing:1px}

/* —— HUD：符牌网格 —— */
.theme-star #hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0 4px}
.theme-star .hudItem{
  flex-direction:column;gap:2px;padding:7px 4px;border-radius:5px;
  background:rgba(21,27,43,.72);border:1px solid var(--glass-line);
  box-shadow:inset 0 0 0 1px rgba(212,175,55,.06);position:relative;
}
.theme-star .hudItem::after{
  content:'';position:absolute;inset:3px;border:1px solid rgba(212,175,55,.10);
  border-radius:3px;pointer-events:none;
}
.theme-star .hudLabel{font-size:10px;color:var(--ink-faint,#6B6455);letter-spacing:2px}
.theme-star .hudVal{font-size:13px;color:var(--gold-hi);font-family:var(--f-num);font-weight:700}
.theme-star #tyRow{color:var(--faint)}
.theme-star #tyNow{color:var(--gold)}

/* —— 叙述条 —— */
.theme-star #sayBox{
  background:rgba(21,27,43,.92);border:1px solid var(--glass-line);
  border-left:2px solid var(--gold);border-radius:6px;color:var(--ink);
  font-size:14.5px;line-height:1.8;
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .theme-star #sayBox{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2)}
}
.theme-star #sayBox.gold{color:var(--gold-hi);font-weight:700}
.theme-star #sayBox.bad{color:#E08A80}

/* —— 结果区：卦牌 —— */
.theme-star #resTitle{color:var(--ink-faint,#6B6455);font-size:12.5px;letter-spacing:3px}
.theme-star #resMain{
  font-family:var(--f-title);font-size:30px;font-weight:900;color:var(--gold-hi);
  opacity:.30;text-shadow:0 0 22px rgba(212,175,55,.35);
  padding:4px 16px;border-radius:6px;position:relative;
}
.theme-star #resMain.pop{
  opacity:1;transform:scale(1.06);
  background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.03));
  box-shadow:0 0 0 1px var(--glass-line),0 0 30px rgba(212,175,55,.22),inset 0 0 22px rgba(212,175,55,.07);
}
.theme-star #resMain .rsub{color:var(--ink-dim,#9A927F)}

/* —— 转盘 —— */
.theme-star #ptr{display:none}
.theme-star .sector{stroke:rgba(212,175,55,.42);stroke-width:1;transition:stroke .2s,stroke-width .2s,fill-opacity .2s}
.theme-star .sector.win{stroke:var(--gold-hi);stroke-width:2.6;fill-opacity:.72;filter:drop-shadow(0 0 6px rgba(232,197,106,.55))}
.theme-star .sector.rigSel{stroke:var(--gold-hi);stroke-width:3}
.theme-star .wheelTxt{fill:#E6DED0}
.theme-star #svg.settled #ringFx{animation:ringPulse .95s cubic-bezier(.18,.8,.25,1) 1}
@keyframes ringPulse{0%{opacity:0;transform:scale(1)}18%{opacity:.9}100%{opacity:0;transform:scale(1.035)}}

/* —— 盘面刻度 / 指针 / 中心盘（starThemeInit 绘制） —— */
.theme-star #dialG,.theme-star #coreG{pointer-events:none}
.theme-star .dialRing{fill:none;stroke:rgba(212,175,55,.26);stroke-width:1}
.theme-star .dialTick{stroke:rgba(212,175,55,.38);stroke-linecap:round}
.theme-star .dialTick.major{stroke:rgba(232,197,106,.72)}
.theme-star #ringFx{fill:none;stroke:var(--gold-hi);opacity:0;transform-box:view-box;transform-origin:340px 392px;vector-effect:non-scaling-stroke;stroke-width:1.6}
.theme-star .ptrTri{fill:var(--gold-hi)}
.theme-star .coreFace{fill:#0E1422;stroke:rgba(232,197,106,.75);stroke-width:1.4}
.theme-star .coreInner{fill:none;stroke:rgba(212,175,55,.45);stroke-width:1}
.theme-star .coreGlyph{fill:var(--gold-hi);font-family:var(--f-title);font-size:30px;font-weight:700;text-anchor:middle}
.theme-star .coreDot{fill:rgba(232,197,106,.8)}

/* —— 结果大字 —— */
.theme-star #flash{color:var(--gold-hi);text-shadow:0 0 24px rgba(232,197,106,.50),0 2px 0 rgba(0,0,0,.55)}
.theme-star #flash .fs{color:rgba(230,222,208,.72);text-shadow:0 0 12px rgba(0,0,0,.55)}

/* —— 操作栏 —— */
.theme-star .opSide,.theme-star .opSide.sel,.theme-star #rerollBtn{
  background:rgba(21,27,43,.62);border:1px solid var(--glass-line);color:var(--faint);
  box-shadow:0 3px 12px rgba(0,0,0,.35),var(--glass-inset);
}
.theme-star .opSide.on,.theme-star .opSide.sel.on{
  background:linear-gradient(180deg,rgba(232,197,106,.92),rgba(176,140,38,.92));
  border-color:rgba(232,197,106,.85);color:#0B0F1A;
  box-shadow:0 4px 16px rgba(212,175,55,.22),inset 0 1px 0 rgba(255,255,255,.35);
}
.theme-star #rerollBtn{color:var(--gold);border-color:rgba(212,175,55,.55)}
.theme-star #rerollBtn.ready{box-shadow:0 0 18px rgba(212,175,55,.30),var(--glass-inset)}
.theme-star #rerollBtn:disabled{opacity:.32}
.theme-star #spinBtn{
  background:linear-gradient(180deg,#F0D488 0%,#D4AF37 46%,#B08A24 100%);
  border:1px solid rgba(255,232,170,.55);color:#0B0F1A;letter-spacing:2px;
  box-shadow:0 10px 26px rgba(212,175,55,.25),inset 0 1px 0 rgba(255,255,255,.55);
}
.theme-star #spinBtn.ready{opacity:1}
.theme-star #keyHint{color:#6E6758}

/* —— 属性 / 播报面板 —— */
.theme-star #panel,.theme-star #logPanel{
  background:rgba(21,27,43,.62);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:var(--glass-shadow),var(--glass-inset);
}
.theme-star #pTitle{color:var(--gold);border-bottom-color:rgba(212,175,55,.22)}
.theme-star .pRow b{color:var(--ink)}
.theme-star .pRow span{color:var(--faint)}
.theme-star .logLine{color:var(--ink)}
.theme-star .logLine.good{color:#7DC4A6}
.theme-star .logLine.bad{color:#E08A80}
.theme-star .logLine.gold{color:var(--gold-hi)}
.theme-star .logLine.battle{color:#B79AD6}
.theme-star .logLine.sys{color:#8E887A}

/* —— 浮层 / 卡片 —— */
.theme-star #overlay{background:rgba(8,11,20,.84);-webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1)}
.theme-star #logOverlay,.theme-star #achvOverlay,.theme-star #dexOverlay{background:rgba(8,11,20,.95)}
.theme-star #endCard,.theme-star #logCard,.theme-star #achvCard,.theme-star #dexCard{
  background:linear-gradient(160deg,rgba(28,36,56,.96),rgba(15,21,35,.96));
  border-color:rgba(212,175,55,.34);
  box-shadow:0 28px 70px rgba(0,0,0,.62),var(--glass-inset);
}
.theme-star #endTitle{
  background-image:linear-gradient(180deg,#F0E7D6 0%,#E8C56A 62%,#C79A2E 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.theme-star #endQuote,.theme-star .endSec{color:var(--faint)}
.theme-star #endAttrs{color:var(--ink)}
.theme-star #endChron{color:#C9C1B1}
.theme-star #endMerits{color:#B79AD6}
.theme-star #endSeed{border-top-color:rgba(212,175,55,.22)}
.theme-star #endSeed .seedLine{color:var(--ink)}
.theme-star #endSeed .seedLine b{color:var(--gold-hi)}
.theme-star #endSeed .seedHint{color:var(--faint)}
.theme-star #logCard h3,.theme-star #achvCard h3,.theme-star #dexCard h3{color:var(--gold)}
.theme-star #logCard .chronLine{color:#C9C1B1}
.theme-star #logList{color:var(--faint)}
.theme-star #achvCard .achvLine,.theme-star #dexCard .achvLine{color:var(--ink);border-bottom-color:rgba(212,175,55,.14)}
.theme-star #achvCard .achvLine span,.theme-star #dexCard .achvLine span{color:var(--faint)}
.theme-star #dexTabs button{background:rgba(21,27,43,.72);color:var(--faint);border-color:var(--glass-line)}
.theme-star #dexTabs button.on{background:linear-gradient(180deg,#E8C56A,#C79A2E);color:#0B0F1A;border-color:transparent}
.theme-star #achvToast{background:rgba(21,27,43,.96);color:var(--gold-hi);border:1px solid var(--glass-line);box-shadow:0 6px 20px rgba(0,0,0,.55)}

/* —— 分享 / 终局按钮 —— */
.theme-star #shareGameBtn,.theme-star #shareRunBtn{
  background:rgba(21,27,43,.56);border-color:rgba(212,175,55,.34);color:var(--gold);
  box-shadow:0 4px 14px rgba(0,0,0,.35),var(--glass-inset);
}
.theme-star #shareRunBtn{color:var(--gold-hi)}
.theme-star #restartBtn{
  background-color:rgba(176,140,38,.92);
  background-image:linear-gradient(160deg,#F0D488 0%,#D4AF37 48%,#A87C1E 100%);
  color:#0B0F1A;border-color:rgba(255,232,170,.5);
  box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 26px rgba(212,175,55,.16),inset 0 1px 0 rgba(255,255,255,.45);
}
.theme-star #shareStatus,.theme-star #endShareStatus{color:var(--faint)}
.theme-star #logClose,.theme-star #achvClose,.theme-star #dexClose{background:linear-gradient(180deg,#E8C56A,#C79A2E) !important;color:#0B0F1A !important}
.theme-star #logClose,.theme-star #achvClose,.theme-star #dexClose{font-weight:700}

/* —— 焦点 / 滚动条 —— */

.theme-star #sayBox::-webkit-scrollbar-thumb,.theme-star #logPanel::-webkit-scrollbar-thumb,.theme-star #endChron::-webkit-scrollbar-thumb{background:rgba(212,175,55,.28)}

/* —— 低配 / 降透明兜底：保持暗色，不回退成白卡 —— */

html.perf-low.theme-star #panel,
html.perf-low.theme-star #logPanel,
html.perf-low.theme-star #endCard,
html.perf-low.theme-star #logCard{background:rgba(21,27,43,.94)}

  .theme-star #sayBox,.theme-star #panel,.theme-star #logPanel,
  .theme-star #endCard,.theme-star #logCard{background:rgba(21,27,43,.94)}
}

/* ============ 天机一转 · 结局翻牌 ============ */
.theme-star #overlay{perspective:1400px}
.theme-star #endCard{position:relative}
.theme-star #overlay:not(.hidden){animation:ovFade .32s ease-out}
@keyframes ovFade{from{background:rgba(8,11,20,0)}to{background:rgba(8,11,20,.84)}}

@keyframes endCardFlip{
  0%  {opacity:0;transform:translateY(20px) scale(.92) rotateX(10deg)}
  55% {opacity:1}
  100%{opacity:1;transform:none}
}
.theme-star #endCard.flipIn{animation:endCardFlip .52s cubic-bezier(.2,.85,.3,1) backwards}

.theme-star #endCard::before{
  content:'';position:absolute;left:50%;top:0;height:2px;width:0;
  background:linear-gradient(90deg,transparent,#E8C56A,transparent);
  transform:translateX(-50%);border-radius:2px;pointer-events:none;opacity:0;
}
.theme-star #endCard.flipIn::before{animation:endLine .72s .10s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes endLine{0%{width:0;opacity:0}35%{opacity:1}100%{width:82%;opacity:.85}}

.theme-star #endCard.flipIn #endTitle{animation:endTitleIn .7s .16s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes endTitleIn{
  0%  {opacity:0;letter-spacing:16px;transform:translateY(6px)}
  100%{opacity:1;letter-spacing:6px;transform:none}
}
.theme-star #endCard.flipIn > *{animation-delay:.10s}
.theme-star #endCard.flipIn > *:nth-child(1){animation-delay:.10s}
.theme-star #endCard.flipIn > *:nth-child(2){animation-delay:.14s}
.theme-star #endCard.flipIn > *:nth-child(3){animation-delay:.18s}
.theme-star #endCard.flipIn > *:nth-child(4){animation-delay:.22s}
.theme-star #endCard.flipIn > *:nth-child(5){animation-delay:.26s}
.theme-star #endCard.flipIn > *:nth-child(6){animation-delay:.30s}

function eraAllowed(entry){
  if(!entry) return true;
  /* eras 用于复活尊者/残念/真传等跨时代但非连续出场，避免 minEra~maxEra 误放行中间时代 */
  if(entry.eras && entry.eras.indexOf(S.eraIdx)<0) return false;
  if(entry.minEra!=null && S.eraIdx < entry.minEra) return false;
  if(entry.maxEra!=null && S.eraIdx > entry.maxEra) return false;
  return true;
}
function charEraAllowed(name){

  return eraAllowed(e);

  return eraAllowed(e);
}
function eventEraAllowed(name){

}

function applyRouteBias(pool){
 if(!pool||!pool.length)return pool;
 for(var i=0;i<pool.length;i++){
  var x=pool[i];if(!x||x.w==null)continue;
  var m=routeBiasMul(x.n||x[0]||'');
  if(m!==1)x.w=Math.max(1,Math.round(x.w*m));
 }
 return pool;
}

/* ===== v1.6.3 重构：tryEraZun 可重试 =====
   旧版问题：_zunTried 在天劫判定之前置位，一次失败整局再也不能成尊——
   哪怕寿元充足、还有事件没用完。
   新版：
     · 用 _zunTries 计数（最多 3 次），不再用 _zunTried 布尔锁；
     · 首次进入给 intro + 争/不争；重试跳过这两段，直接进天劫；
     · 再试一次寿元 -5，且成功率按 0.85^n 递减；
     · 寿元 <=10 时不再询问「再试」，直接收手。
   调用点零改动：各时代收束函数里的 `if(await tryEraZun('xx'))return;` 依旧有效。 */
async function tryEraZun(eraKey){
 if(S.flags.becameZun)return false;
 if(!zunGate())return false;
 var conf=ERA_ZUN[eraKey]; if(!conf)return false;
 if(conf.need&&!conf.need())return false;

 var tries=S.flags._zunTries||0;
 if(tries>=3)return false;

 /* 首次进入：给 intro + 争/不争；重试跳过 */
 if(tries===0){
  await say(conf.intro,'gold');
  var go=await optW(conf.title,[['争此一尊',55],['暂不争尊',45]]);
  if(go!==0){await say('你压下了那股冲天的念头。尊位还在，人还在。','sys');return false;}
  if(S.life<30)await say('寿元已薄——争尊若败，未必还有下一次。','bad');
 }

 while(true){
  if(S.life<=0)return false;
  S.flags._zunTries=(S.flags._zunTries||0)+1;
  tries=S.flags._zunTries;

  var p=eraZunScore()+(conf.bonus?conf.bonus():0);
  /* v1.22：至尊仙胎成尊线略抬天劫通过率（封存路线不加）；不绕过八转巅峰与准无上门槛 */
  if(S.flags.supreme&&S.flags.supremePath&&S.flags.supremePath!=='seal')p+=S.flags.supremePath==='self'?6:(S.flags.supremePath==='fang'?5:4);
  p=Math.max(8,Math.min(88,p));
  if(tries>1)p=Math.max(8,Math.round(p*Math.pow(0.85,tries-1))); /* 第2次×0.85、第3次×0.72 */
  await say('天地似有感应——成功率约 '+p+'%。','sys');

  var trialFail=false;
  if(conf.trial){
   var tok=await conf.trial();
   if(tok===false){trialFail=true;await say('争尊之劫未过。路还在，只是今日不够。','bad');}
  }

  if(!trialFail && await rollW(p,conf.title+'·天劫盘（'+p+'%）')){
   /* ===== 成尊成功 ===== */
   S.lv=9;S.flags.becameZun=true;S.flags.ya=true;
   var X=mainSchool().name.replace(/道$/,'');
   await say('轰——九转之象在'+conf.eraName+'之世炸开。你以【'+X+'道】称尊！','gold');
   chr(conf.eraName+'之世·称尊');
   /* v1.14.26 番外放宽：任意时代·剑道成尊（不限疯魔窟）→ 斩道 */
   if(isJianMain()&&jianXin()>=2&&!S.flags._jzOffered){
    if(await jianZunAfter())return true;
   }
   if(conf.onWin)await conf.onWin(X);
   else{
    var c=await optW('称尊之后',[['开宗传道',40],['隐名逍遥',35],['与当世尊者分庭',25]]);
    if(c===0)await ending(conf.eraName+'成尊·开宗','你以'+X+'道在'+conf.eraName+'之世立宗。');
    if(c===1)await ending(conf.eraName+'成尊·逍遥','尊位落在你身上，你却去了没有碑的地方。');
    await ending(conf.eraName+'成尊·分庭','当世已有'+conf.eraName+'，又多了你。天道勉强记下两个名字。');
   }
   return true;
  }

  /* ===== 失败：允许再试（最多 3 次，寿元 >10 才问） ===== */
  await say(conf.failSay||'天不认你。不是差实力，是差那一层「被写进天道」的资格。','bad');
  if(conf.onFail)await conf.onFail();
  if(tries>=3||S.life<=10)return false;

  var retry=await optW('争尊失败·再试？',
   [['再冲一次（寿元-5·成功率递减）',50],['就此收手',50]]);
  if(retry!==0)return false;
  spendLife(5);
  await say('你压住伤势，把气机重新提起来。','sys');
 }
}

async function maybeRandEvent(phase){

  S.flags.randUsed[ev.id]=true;dexAdd('ev',ev.n); /* v1.4.17 事件图鉴·随机奇遇登记 */

  return true;
 }catch(e){

 }

/* ── 11 EVENT · 关键历练 ─────────────────────────────────────────── */
function myPower(){return anchor()+realmBonus()+30;}
function lvOfAnchor(a){return a>=500?9:a>=250?8.5:a>=210?8.5:a>=200?8:a>=175?7.5:a>=150?7:a>=130?6.5:a>=100?6:a>=70?5.5:a>=60?5:a>=45?4:a>=35?3:a>=20?2:1;}
/* 战败盘权重：轻伤固定最高42、再战固定最低8、重伤24；死亡=5+8×转差^1.5 平滑上扬，
   转差≥3 时当场死亡强制100%。[PLACEHOLDER·Monte Carlo 验证路径：g10_run.js 看死亡率拐点] */
function defeatWeights(wLv,lLv,deathTop,dblDeath){
 var dblBoost=dblDeath?2:1; /* v1.2.5：重伤未愈——当场死亡概率提升 100%（权重翻倍） */
 if(deathTop)return [['再战',8],['轻伤撤退',42],['重伤逃跑',24],['当场死亡',45*dblBoost]];
 var d=Math.max(0,Math.floor(wLv)-Math.floor(lLv));
 if(d>=3)return null;
 var death=5+8*Math.pow(d,1.5);
 death*=((Math.floor(lLv)>=6)?2:1.5);
 return [['再战',8],['轻伤撤退',42],['重伤逃跑',24],['当场死亡',death*dblBoost]];
}
function defeatSecs(w,allowRetry,forPlayer){
 var col={'再战':'#1E8449','轻伤撤退':'#2471A3','重伤逃跑':'#D35400','当场死亡':'#C0392B'};
 var list=w||[['当场死亡',100]];
 if(!allowRetry)list=list.filter(function(x){return x[0]!=='再战';});
 return list.map(function(x){return [x[0],x[1],undefined,col[x[0]]];});
}
 async function playerDefeat(eT,label,allowRetry,deathName,saves,deathCut,opts){
 opts=opts||{};
 if(S.flags.tyTier===2&&!S.flags.tySaved){S.flags.tySaved=true;await say('【天意庇佑】——你本该死了，但天意把你从死亡线上拉了回来（钟爱档 · 全局一次）。','gold');return 'retry';} /* v1.5.0 */
 if(S.flags.passiveSanqi){S.flags.passiveSanqi=false;await say('【被动仙道杀招·三气归来】发动——气绝复生，你再度站起！（全局仅一次）','gold');return 'retry';} /* v1.0.14 */
 if(typeof deathCut!=='number'||!isFinite(deathCut))deathCut=null; /* v1.0.8：防参数错位传入对象 */
 var w=defeatWeights(lvOfAnchor(eT),S.lv,!!opts.deathTop,S.flags.injured>0);
 if(deathCut&&!opts.deathTop)w=w.map(function(x){return x[0]==='当场死亡'?[x[0],Math.round(x[1]*deathCut)]:x;});
 var secs=defeatSecs(w,allowRetry,true);
 secs=secs.filter(function(x){return isFinite(x[1])&&x[1]>0;}); /* v1.0.8：滤掉 NaN/0 权重，保证盘面可渲染 */
 if(!secs.length)secs=[['再战',100]];
 if(opts.noFlee)secs=secs.filter(function(x){return x[0]!=='轻伤撤退'&&x[0]!=='重伤逃跑';});
 await say(label+'——你落下风！战败盘落定去留。','bad');
 var idx=await W('战败盘',label+' · 败者听天由命',secs,{small:true,cls:'bad'});
 var name=secs[idx][0];
 if(name==='当场死亡'){
  if(saves){var tags=['nilu','sanqi','wuji','hunbao'];for(var si=0;si<tags.length;si++){if(await trySave(tags[si],saves))return 'saved';}}
  if(S.flags.ctrlOnce>0){S.flags.ctrlOnce--;S.pctMods-=0.15;await say('【超级蛊阵控制权】轰然发动——你从必死之局中被挪出阵外！','gold');return 'saved';}
  if(hasMark('红莲真意')&&!S.flags.hlUsed){S.flags.hlUsed=true;await say('红莲真意燃起——败势倒转，你脱出死地！','gold');return 'saved';}
  if(await tryBatchSave()){await say('【'+S.flags.batchSaveName+'】护体——你从死局中脱身！','gold');return 'saved';} /* v1.1.6【接线】批量保命类（无量气海/鬼官衣） */
  if(opts.fatalAsHurt){S.pctMods-=0.15;spendLife(5);await say('天地伟力压落——你被重伤吐出，捡回一条命（权重-15%、寿元-5年）。','bad');await applyInjury();return 'done';}
  await say('刀光落处，再无姓名——你死在了半路上。','bad');
  await ending(deathName||'路边一条','不是每具尸骸都有名字，路边的尤其没有。');return 'dead';}
 if(name==='重伤逃跑'){await say('重伤遁逃——捡回一条命，伤势拖累此后战局。','bad');S.pctMods-=0.15;spendLife(3);await applyInjury();chr(label+'战败·重伤遁逃');}

 else return 'retry';
 return 'done';
}

/* battleRound 的增强版：支持每式权重覆盖 / 禁逃 / 战败不判死 / 保命特效上限 */
async function backRound(eT,label,onWin,opts){
 opts=opts||{};
 if(S.eraIdx===8&&S.flags.hyOn&&!S.flags.hyFought)hyAddBattle(eT); /* v1.2.9增补④：幽魂之世——每场战斗叠加关注度 */

    （如天庭追杀者的战果盘），此时 backRound 不再追加『敌将战败盘』，
    避免同一场战斗被结算两次（当场斩杀后仍被判「重伤逃跑」）。 */
 var selfOutcome=(opts.enemyOutcome==='onWin');
 var rewarded=false;
 async function winOnce(){if(!rewarded){rewarded=true;await onWin();bloodKill(eT);}}
 for(var at=0;at<2;at++){
  if(await duel(eT,label,opts)){
   await winOnce();
   if(selfOutcome){await injuryTick();return true;} /* 已由 onWin 裁定敌方去留，不再二次结算 */
   var er=await enemyDefeat(eT,label,at===0);
   if(er==='retry'&&at===0){await say(label+'——敌将缠战！','battle');if(await duel(eT,label,opts)){await winOnce();await injuryTick();return true;}await playerDefeat(eT,label,false,opts.deathName||null,null,null,opts);await injuryTick();return true;}
   await injuryTick();return true;
  }
  var pr=await playerDefeat(eT,label,at===0,opts.deathName||null,null,null,opts);
  if(pr==='retry'&&at===0){await say(label+'——再战！','battle');continue;}
  await injuryTick();return false;
 }
 await injuryTick();return false;
}

 }

 }
 if(m.name==='时砂倒流'){ /* v1.3.4：宙道境界动态权重 */

 }
 if(m.name==='无我剑意'){ /* v1.3.5：剑道专属·动态权重 */

 }

/* ══ 心剑关（v1.14.26） ══════════════════════════════════════════════
   独立实现，不复用 duel()：镜像用玩家自己的杀招打玩家，不落敌方杀招轮。
   三合两胜：每合抓一个玩家杀招作为"镜像招式"，判玩家是否截断。
   返回 true = 过关；false = 失败（杀招≥4 时丢掉第一个被"带走"的杀招，不足四式则改为永久扣该式权重）。
   ==================================================================== */
async function jianXinDuel(){
 var hits=0,forgot=[];

 /* 薄青真传线：镜像先亮薄青的招，压迫感拉满 */
 if(hasMark('薄青真传')&&S.moves.some(function(m){
   return ['五指拳心剑','五指全心剑','剑痕索命','一剑西来','无我剑意'].indexOf(m.name)>=0;
 })){
  await say('对方先笑了：「薄青那一套，我也会。」','battle');
 }

 for(var r=0;r<3;r++){
  /* 从玩家杀招池里抓一个还没被"记住"的 */
  var cand=S.moves.filter(function(m){return m.t!=='basic'&&forgot.indexOf(m.name)<0;});
  if(cand.length){
   var pickM=cand[Math.floor(RNG()*cand.length)];
   forgot.push(pickM.name);
   await say('「我记得这一式。」——对方使出了【'+pickM.name+'】。','bad');
  }else{
   await say('对方使出一式你叫不出名字的剑。','bad');
  }

  /* 每合判定：剑心阶位 + 剑道境界 + 基础 45 */
  var pr=Math.min(92,45+jianXin()*10+rlm('剑道')*4);
  if(await rollW(pr,'心剑关·第'+(r+1)+'合（'+pr+'%）')){
   hits++;
   await say('你以更快的剑截断了它。','good');
  }else{
   await say('这一合，你慢了。','bad');
  }
 }

 /* 两胜即过：被"记住"的招全部归还 */
 if(hits>=2){
  if(forgot.length)await say('被遗忘的招重新回到剑心：'+forgot.join('、')+'。','gold');
  return true;
 }

 /* 败：杀招充足时删除；不足四式则改扣该式权重，避免杀招盘崩坏 */
 if(forgot.length){
  var loss=forgot[0],nonBasic=0;
  S.moves.forEach(function(m){if(m.t!=='basic')nonBasic++;});
  if(nonBasic<4){
   var lm=null;
   for(var i=0;i<S.moves.length;i++){if(S.moves[i].name===loss){lm=S.moves[i];break;}}
   if(lm){
    lm.wPen=Math.min(0.6,(lm.wPen||0)+0.2);
    await say('【'+loss+'】没有被带走——杀招不足四式，剑心替你护住了它，但此式永久 -20% 权重（累计 -'+Math.round(lm.wPen*100)+'%）。','bad');
    log('心剑关败——杀招不足四式，改扣【'+loss+'】权重（累计 -'+Math.round(lm.wPen*100)+'%）。','bad');
   }
  }else{
   for(var i=0;i<S.moves.length;i++){
    if(S.moves[i].name===loss){S.moves.splice(i,1);break;}
   }
   await say('【'+loss+'】从此不在你的剑里。','bad');
   log('心剑关败——杀招【'+loss+'】被"没有剑的你"带走。','bad');
  }
 }
 return false;
}

}

/* ══ 12 ERA · 盗天魔尊期「无蛊之世」 ═══════════════════════════════════
   v1.3.1 · 盗天魔尊期「无蛊之世」
   ---------------------------------------------------------------------
   原作出处：
     ·「他擅长宇道，开创偷道」        ·「不用任何仙元，就能时刻有效」
     ·「无相手……不管是不是本命蛊，一律照夺不误」
     ·「抽取自身宇道道痕凝结出盗天空间，堵住缺口」
   机制：
     M1 万蛊失窃   每事件 完善度 −1（下限 0）
     M2 双弱       战斗末步双方权重 ×0.5（相对胜率不变，回合拉长）
     M3 无相手掠影 每 5 个事件一次；命中 → 完善度 −2 且留下「窃痕」10 事件
     M4 窃取度     满 100 → 空穴显露
     M5 道统红利   宇道/偷道 降低被窃概率
   ===================================================================== */
var DT_HOLE=60;   /* v1.3.1：实测盗天期约 10–16 个事件，阈值由 100 下调至 60 */
function dtOn(){return S.eraIdx===6;}
function dtTaint(){return S.flags.dtTaint||0;}
function dtStealVal(){return Math.min(100,dtBase()+(S.flags.dtSt||0));}
function dtBase(){
 var lv=S.lv,b=0;
 if(lv>=8.5)b=70;else if(lv>=8)b=40;else if(lv>=7)b=20;
 if(hasSchool('偷道'))b+=10;
 return Math.min(100,b);
}
function dtAdd(n){S.flags.dtSt=(S.flags.dtSt||0)+n;if(dtStealVal()>=DT_HOLE)S.flags.dtSt=DT_HOLE-dtBase();}

/* 完善度下降（与 wormUp 对称；WORM_N 下标越大越差） */
async function wormDown(n){
 for(var k=0;k<n;k++){
  if(S.wormIdx>=WORM_N.length-1){log('蛊虫完善度已至最低——再无可失。','bad');return;}
  S.wormIdx++;
  log('蛊虫完善度下降 → '+wormName()+'（万蛊失窃）','bad');
 }
}

async function dtTick(){
 if(!dtOn())return;
 S.flags.dtEv=(S.flags.dtEv||0)+1;
 await wormDown(1);
 if(dtTaint()>0){
  S.flags.dtTaint--;
  if(S.flags.dtTaint%3===0&&S.flags.dtTaint>0)await wormDown(1);
  if(S.flags.dtTaint===0)await say('窃痕终于淡了。窍中重新听得见蛊虫的动静。','good');
 }

}

 }

 /* —— 道德 / 道心 —— */
 if(S.morIdx<=1&&dtStealVal()>=30){

 }

 /* —— 低等级 / 低窃取 —— */
 if(Math.floor(S.lv)<3)await ending('碌碌无为','刀没丢，胆丢了。这一世你什么也没偷到。');
 if(dtStealVal()<20&&Math.floor(S.lv)<5){
  await ending('未被选中的人','无相手从你头顶掠过，没有停。有时这是幸运。');
 }

 /* —— 默认收束 —— */
 var def=await optW('盗天世收束',[['安享晚年',35],['继续行窃',30],['远走无门处',20],['枕缝而眠',15]]);
 if(def===0)await ending('安享晚年','你活过了那个什么都被偷走的年代。这就够了。');
 if(def===1)await ending('窃运不休','时代结束了，你的手还没结束。');
 if(def===2)await ending('寻无缝土','你去了据说没有门缝的地方。住了三年，发现床下有一道细线。');
 await ending('枕缝而眠','最后一晚，你把耳朵贴在墙上。墙里没有风。你反而睡不着。');

/* ══ 14.7 CHG · 更新日志组件 ═══════════════════════════════════════
   玩家可随时查看；首次进入或版本变化时自动弹一次（已读版本存 guSeenChg）。
   入口：点标题旁的版本号。 */
function changelogRender(showNew){
 var list=$('chgList');if(!list)return;
 var TAG={new:'新增',fix:'修复',bal:'平衡'};
 list.innerHTML=CHANGELOG.map(function(block,i){
  var fresh=(i===0&&showNew);
  var head='<div class="chgHead">'+block.v+(fresh?'<span class="chgBadge">新</span>':'')+'</div>';
  var body=block.items.map(function(it){
   var t=TAG[it[0]]||'更新';
   return '<div class="chgLine"><span class="chgTag '+it[0]+'">'+t+'</span>'+it[1]+'</div>';
  }).join('');
  return head+body;
 }).join('');
 var v=$('chgVer');if(v)v.textContent=APP_VER;
}
function openChangelog(){
 var wasNew=false;
 try{wasNew=(localStorage.getItem('guSeenChg')!==APP_VER);}catch(e){wasNew=true;}
 changelogRender(wasNew);
 var el=$('chgOverlay');if(el)el.classList.remove('hidden');
 try{localStorage.setItem('guSeenChg',APP_VER);}catch(e){}
}
function closeChangelog(){
 var el=$('chgOverlay');if(el)el.classList.add('hidden');
 try{localStorage.setItem('guSeenChg',APP_VER);}catch(e){}
}

/* ══ 15 BOOT · 启动绑定 ════════════════════════════════════════════ */
function syncToggles(){var _a=$('autoBtn');if(_a)_a.className='opSide'+(AUTO?' on':'');var _f=$('fastBtn');if(_f)_f.className='opSide'+(FAST?' on':'');var _r=$('rigBtn');if(_r)_r.className='opSide'+(RIG_ON&&chanTier()?' on':'');syncRerollBtn();syncRigBtn();}
/* v1.1.3 卡死修复②：启动期 DOM 绑定一律走 on() 空值保护。
   历史事故：此处绑定 restartBtn，而 HTML 漏写该按钮 → $(id) 为 null → 抛 TypeError，
   启动脚本自此中断，runGame() 永不执行 → 页面停在静态外壳、所有按钮无响应（＝卡死）。
   教训：验收桩的 getElementById 会自动补建元素，这类「元素缺失」错误只能在真实浏览器暴露。 */
function on(id,ev,fn){var el=$(id);if(el)el.addEventListener(ev,fn);}
['autoBtn','fastBtn','restartBtn','voiceBtn','rigBtn','achvBtn','dexBtn'].forEach(function(id){
 on(id,'pointerdown',function(e){e.stopPropagation();});
});
/* v1.4.13：指定落点状态刷新（AUTO/指定 互斥时复用）——盘中途开关即时刷新当前盘的可点状态与提示（已锁定/已开转的盘不动） */
function syncRig(){
 if(CUR_SP&&!CUR_SP._locked){
  CUR_SP._rig=null;
  for(var k=0;k<CUR_SP.secs.length;k++){var el=CUR_SP.secs[k]._el;if(!el)continue;el.classList.remove('rigSel');if(RIG_ON)el.classList.add('rigAble');else el.classList.remove('rigAble');}
  var rm=$('resMain');if(rm)rm.textContent=RIG_ON?'点盘面扇区，指定落点':'？？';
 }
}
on('autoBtn','click',function(){AUTO=!AUTO;if(AUTO)RIG_ON=false;if(AUTO)log('AUTO 已开——春秋蝉暂不可用；需要逆流请先关 AUTO','sys');syncRig();syncToggles();}); /* v1.4.13：开 AUTO 强制关指定（互斥） */

on('dexClose','click',function(){$('dexOverlay').classList.add('hidden');});

on('dexTabs','click',function(e){var t=e.target&&e.target.getAttribute&&e.target.getAttribute('data-dextab');if(t){DEX_TAB=t;dexRender();}});
/* v1.2.9：R 键＝重抽（桌面端）；触屏不响应 */
document.addEventListener('keydown',function(e){if(IS_TOUCH)return;if(!_pending2)return;if(e.key==='r'||e.key==='R'){e.preventDefault();if(rerollLeft()>0){btn(false,'· · ·');var h=_pending2;_pending2=null;h('reroll');}}});

VOICE.boot();

try{
 var _dm=(navigator.deviceMemory||8),_hc=(navigator.hardwareConcurrency||8);

(function(){var v=$('verTag');if(v){v.textContent=APP_VER;v.style.cursor='pointer';v.title='查看更新日志';v.addEventListener('click',openChangelog);}})();

try{
 runGame()['catch'](function(e){

 });
}catch(e){try{console.error('[天机一转] 启动异常：',e);}catch(_){}}

})();

<script>
(function() {
  var s = document.createElement('script');
  // 加时间戳防止被浏览器缓存了坏的结果
  s.src = 'https://events.vercount.one/js?t=' + new Date().getTime();
  
  s.onerror = function() {
    setToError();
  };
  
  s.onload = function() {
    // 如果脚本加载完了，但 2 秒内还没把 Loading 替换掉，说明接口挂了或超时
    setTimeout(function() {
      var pv = document.getElementById('vercount_value_page_pv');
      if (pv && pv.innerText === 'Loading') {
        setToError();
      }
    }, 2000);
  };
  
  function setToError() {
    var pv = document.getElementById('vercount_value_page_pv');
    if (pv && pv.innerText === 'Loading') {
      document.getElementById('vercount_value_page_pv').innerText = '—';
      document.getElementById('vercount_value_site_pv').innerText = '—';
      document.getElementById('vercount_value_site_uv').innerText = '—';
    }
  }
  document.body.appendChild(s);
})();
</script>
