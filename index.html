AI 开发规范 · 新增杀招（v1.30）

2. 玩家可获得：holder:'玩家'，图鉴自动收录。敌方专属：holder:'敌方'，默认不进图鉴；确需收录时在该条目增加 dex:true。
3. trigger 使用自然语言写清习得/触发路径（如“在某处习得”），不要写“——”“不可获得”等占位文字。
4. 必须确认实际授予路径：learnSpec / addMove / grantBatchSpec / DREAM_SPEC_POOL 等；仅有数据登记不等于玩家可获得。

6. 统计总表口径的批量杀招带 batch:true；batchEntries 由 SPEC_LIB.entries 惰性派生，新增条目只需 push 到 entries，不要手动维护 batchEntries。

AI 开发规范 · 终局控制流（v1.35 起）
规则：ending() 使用 END_SENTINEL 结束当前异步链；新增 catch 时必须先判断 e&&e.end 并原样 throw，
不得把终局信号当作普通错误吞掉。finally 可用于释放锁，但不得阻断异常继续传播。

AI 开发规范 · 新增结局（v1.33 起；v1.37 起 opts 可附 epilogue 后世评语；v1.38 起重点结局有专属史书短评；v1.39 起签文关联结果、事件支持文本变奏；v1.40 起门控擦肩叙事与世人侧写；v1.41 起空事件/反常签须保持纯叙事且不登记普通事件）
规则：新增结局只需【一句 ending(...)】，图鉴自动收录。
DEX_ENDINGS 是未触发结局的静态占位表，由 gen-endings.js 从 ending() 字面量及
战斗配置 deathName 字面量自动生成；新增结局后重跑脚本，不手工维护列表。
END_META 仍由人工维护分组 / tier / hint 覆盖；不要自动生成或覆盖 END_META。
不要再手动改 DEX_ENDINGS / END_META / LINE_ORDER / dexStatics / dexHint / dexRender。

【写法一 · 最简（推荐大多数情况）】
  await ending('新结局名', '一句谶语');
  → 图鉴自动收录；谶语即图鉴 hint。
  → 分组：名字含「·」时取前缀（且 LINE_NAME 已登记），否则归 other。

【写法二 · 精确声明】
  await ending('新结局名', '结局弹窗长谶语', {
    line: '剑道',                   // 分组 key，需在 LINE_NAME 已登记
    tier: 3,                        // 1 死亡/失败 · 2 普通 · 3 高光/成尊
    hint: '图鉴里显示的短谶语'      // 省略则用第 2 参数 quote
  });

【新增分组】
  先在 LINE_NAME 加一行：'新线':'新线中文名'
  再在 LINE_ORDER 数组里插入 '新线'（放在 other 之前）。
  然后在 ending() 的 opts.line 里使用。

【禁止】
  × 不要再往 DEX_ENDINGS 里手动 push 结局名。
  × 不要再往 END_META 里手动写单条结局元数据（永久固定且需覆盖运行时兜底除外）。
  × 不要用「其他/other」以外的占位分组名。

【兜底行为】
  - 未登记进 END_META 的结局，运行时自动写入 _endingDynamic，图鉴仍可见。
  - 静态 END_META 优先于动态区；冲突时静态胜。

/* =====================================================================
   v1.3.0 · 前端 UI 磨砂玻璃（Glassmorphism）
   ---------------------------------------------------------------------
   设计取色仍留在原本的宣纸/朱砂/青瓷/金 体系内，不做通用 Apple 玻璃，
   避免变成另一款游戏。
   性能约束：真 backdrop-filter 只给「大面板」，且同一屏最多 4 片；
            小控件一律用伪玻璃（半透明 + 内高光），不产生额外合成层。
            转盘 SVG 的祖先链上绝不挂任何 filter。
   ===================================================================== */
:root{
  --glass:rgba(255,255,255,.40);
  --glass-hi:rgba(255,255,255,.54);
  --glass-line:rgba(255,255,255,.74);
  --glass-edge:rgba(122,112,92,.12);
  --glass-shadow:0 10px 30px rgba(90,78,55,.10);
  --glass-inset:inset 0 1px 0 rgba(255,255,255,.92);
  --glass-blur:18px;
}

/* ---- 背景层：玻璃的"内容" ---- */
#bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(52% 34% at 8% 2%,   rgba(226,64,58,.34),   transparent 66%),
    radial-gradient(46% 30% at 94% 4%,  rgba(206,166,84,.38),  transparent 68%),
    radial-gradient(52% 34% at 90% 94%, rgba(86,138,130,.32),  transparent 70%),
    radial-gradient(46% 30% at 2% 96%,  rgba(150,118,86,.28),  transparent 72%),
    radial-gradient(40% 26% at 50% 52%, rgba(255,255,255,.55), transparent 72%),
    linear-gradient(160deg,#FAF6ED 0%,#F1EADB 45%,#E7DDCA 100%);
  box-shadow:inset 0 0 140px rgba(120,104,78,.10);
}
#app{position:relative;z-index:1}

/* ---- 标题：轻玻璃 ---- */
#titleText{
  background:var(--glass-hi);
  background-image:linear-gradient(135deg,rgba(255,255,255,.70) 0%,rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 62%);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(12px) saturate(1.3);
          backdrop-filter:blur(12px) saturate(1.3);
  box-shadow:var(--glass-shadow),var(--glass-inset);
}

/* ---- HUD 胶囊：伪玻璃（不模糊） ---- */
.hudItem{
  background:rgba(255,255,255,.44);
  border:1px solid rgba(255,255,255,.60);
  box-shadow:0 2px 8px rgba(90,78,55,.07),inset 0 1px 0 rgba(255,255,255,.85);
}

/* ---- 叙事框：真玻璃 ---- */
#sayBox{
  background:var(--glass);
  background-image:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.08) 42%,rgba(255,255,255,0) 64%);
  border:1px solid var(--glass-line);
  border-radius:18px;
  margin:4px 0;
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.35);
          backdrop-filter:blur(var(--glass-blur)) saturate(1.35);
  box-shadow:var(--glass-shadow),var(--glass-inset);
}

/* ---- 主按钮：玻璃 + 朱砂投影 ---- */
#spinBtn{
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 10px 26px rgba(229,67,61,.17),0 1px 0 rgba(120,110,90,.06),inset 0 1px 0 rgba(255,255,255,.96);
}
#spinBtn.ready:active{transform:scale(.97)}

/* ---- 次按钮：伪玻璃 ---- */
.opSide,.opSide.sel,#rerollBtn{
  background:rgba(255,255,255,.50);
  border:1px solid rgba(255,255,255,.66);
  color:#5F594B;
  box-shadow:0 3px 10px rgba(90,78,55,.08),inset 0 1px 0 rgba(255,255,255,.86);
}
.opSide:active,.opSide.sel:active,#rerollBtn:active{transform:scale(.96)}
.opSide.on,.opSide.sel.on{
  background:rgba(58,58,58,.88);
  border-color:rgba(58,58,58,.92);
  color:#FFF;
  box-shadow:0 4px 14px rgba(40,36,30,.22),inset 0 1px 0 rgba(255,255,255,.14);
}
#rerollBtn{background:rgba(255,251,235,.62);border-color:rgba(217,199,122,.72);color:#8A6D1F}
#rerollBtn.ready{box-shadow:0 4px 14px rgba(217,199,122,.45),inset 0 1px 0 rgba(255,255,255,.9)}

/* ---- 属性面板 / 播报面板：真玻璃 ---- */
#panel,#logPanel{
  background:rgba(255,255,255,.50);
  background-image:linear-gradient(135deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.06) 38%,rgba(255,255,255,0) 58%);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.35);
          backdrop-filter:blur(var(--glass-blur)) saturate(1.35);
  box-shadow:var(--glass-shadow),var(--glass-inset);
}
#pTitle{border-bottom-color:rgba(122,112,92,.18)}

/* ---- 浮层卡片：厚玻璃 ---- */
#endCard,#logCard{
  background:var(--glass-hi);
  background-image:linear-gradient(135deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.10) 38%,rgba(255,255,255,0) 58%);
  border:1px solid rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(24px) saturate(1.42);
          backdrop-filter:blur(24px) saturate(1.42);
  box-shadow:0 18px 52px rgba(70,60,40,.18),inset 0 1px 0 rgba(255,255,255,.95);
}
/* 结束浮层：轻模糊压掉底层日志文字（此时转盘已静止，模糊结果可缓存，不产生逐帧开销） */
#overlay{
  background:rgba(247,243,234,.80);
  -webkit-backdrop-filter:blur(10px) saturate(1.08);
          backdrop-filter:blur(10px) saturate(1.08);
}
#logOverlay{background:rgba(247,243,234,.92)}

/* ---- 分享按钮 ---- */
#shareGameBtn,#shareRunBtn{
  background:rgba(255,255,255,.52);
  border:1px solid rgba(255,255,255,.68);
  box-shadow:0 3px 10px rgba(90,78,55,.07),inset 0 1px 0 rgba(255,255,255,.86);
  min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;
}

/* ---- 滚动条：细一点，别破坏玻璃感 ---- */
#sayBox::-webkit-scrollbar,#logPanel::-webkit-scrollbar,#endChron::-webkit-scrollbar{width:6px}
#sayBox::-webkit-scrollbar-thumb,#logPanel::-webkit-scrollbar-thumb,#endChron::-webkit-scrollbar-thumb{
  background:rgba(122,112,92,.24);border-radius:3px;
}
#sayBox::-webkit-scrollbar-track,#logPanel::-webkit-scrollbar-track,#endChron::-webkit-scrollbar-track{background:transparent}

/* ---- 键盘可达性 ---- */
button:focus-visible,select:focus-visible,input:focus-visible{
  outline:2px solid rgba(229,67,61,.55);outline-offset:2px;
}

/* ---- 兜底一：浏览器不支持 backdrop-filter ---- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #titleText,#sayBox,#panel,#logPanel,#endCard,#logCard{background:rgba(255,255,255,.88)}
}

/* ---- 兜底二：低配设备（JS 打 perf-low）/ 系统要求减少透明 ---- */
html.perf-low #titleText,
html.perf-low #sayBox,
html.perf-low #panel,
html.perf-low #logPanel,
html.perf-low #endCard,
html.perf-low #logCard{
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:rgba(255,255,255,.88);
}
@media (prefers-reduced-transparency:reduce){
  #titleText,#sayBox,#panel,#logPanel,#endCard,#logCard{
    -webkit-backdrop-filter:none;backdrop-filter:none;
    background:rgba(255,255,255,.90);
  }
}

/* =====================================================================
   v1.3.0 · 结局战报画面
   ---------------------------------------------------------------------
   1) 玻璃更通透：降低填充不透明度、加大 blur 与 saturate，让身后模糊的
      转盘色彩真正透上来；靠"边缘高光 + 斜切反光"维持边界感，而不是靠白底。
   2) 两个按钮加互动：悬停抬升 + 内光晕 + 斜切扫光 + 按下回弹。
      动效只用 transform / opacity（伪元素承载），不触碰布局属性。
   3) 入场层次：卡片淡入 + 子元素逐个上浮，阅读顺序自然。
   ===================================================================== */
#overlay{
  background:rgba(247,243,234,.62);
  -webkit-backdrop-filter:blur(18px) saturate(1.22);
          backdrop-filter:blur(18px) saturate(1.22);
}
#endCard{
  position:relative;
  background:rgba(255,255,255,.34);
  background-image:
    linear-gradient(152deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 30%,rgba(255,255,255,0) 48%),
    radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.28),rgba(255,255,255,0) 62%);
  border:1px solid rgba(255,255,255,.76);
  -webkit-backdrop-filter:blur(32px) saturate(1.6);
          backdrop-filter:blur(32px) saturate(1.6);
  box-shadow:
    0 30px 80px rgba(70,60,40,.20),
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -1px 0 rgba(255,255,255,.34);
  animation:endCardIn .30s ease-out backwards;
}
@keyframes endCardIn{from{opacity:0}to{opacity:1}}

/* 子元素逐个上浮（transform/opacity，不触发重排） */
@keyframes endItemIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
#endCard > *{animation:endItemIn .40s cubic-bezier(.2,.9,.3,1) backwards}
#endCard > *:nth-child(1){animation-delay:.05s}
#endCard > *:nth-child(2){animation-delay:.09s}
#endCard > *:nth-child(3){animation-delay:.13s}
#endCard > *:nth-child(4){animation-delay:.17s}
#endCard > *:nth-child(5){animation-delay:.21s}
#endCard > *:nth-child(6){animation-delay:.25s}
#endCard > *:nth-child(7){animation-delay:.29s}
#endCard > *:nth-child(8){animation-delay:.33s}
#endCard > *:nth-child(9){animation-delay:.37s}
#endCard > *:nth-child(10){animation-delay:.40s}

/* 结局标题：墨色到金的渐变字，落在玻璃上更立体 */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  #endTitle{
    background-image:linear-gradient(180deg,#2B2620 0%,#55482F 58%,#9A7A24 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:none;
  }
}

/* ---- 两个按钮的共用互动骨架 ---- */
#shareRunBtn,#restartBtn{
  position:relative;isolation:isolate;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  width:100%;max-width:280px;margin:16px auto 0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .18s cubic-bezier(.2,1.3,.4,1),
             box-shadow .24s ease, border-color .24s ease, opacity .2s;
}
#shareRunBtn::before,#restartBtn::before,
#shareRunBtn::after,#restartBtn::after{
  content:'';position:absolute;pointer-events:none;border-radius:inherit;z-index:-1;
}
/* 悬停内光晕 */
#shareRunBtn::before,#restartBtn::before{
  inset:-45%;opacity:0;transition:opacity .3s ease;
  background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);
}
/* 斜切扫光 */
#shareRunBtn::after,#restartBtn::after{
  top:-60%;left:-85%;width:55%;height:220%;opacity:0;
  transform:rotate(16deg) translateX(0);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.50),rgba(255,255,255,0));
  transition:transform .62s cubic-bezier(.3,.7,.3,1),opacity .34s ease;
}
@media (hover:hover) and (pointer:fine){
  #shareRunBtn:hover,#restartBtn:hover{transform:translateY(-2px)}
  #shareRunBtn:hover::before,#restartBtn:hover::before{opacity:1}
  #shareRunBtn:hover::after,#restartBtn:hover::after{opacity:1;transform:rotate(16deg) translateX(430%)}
}
#shareRunBtn:active,#restartBtn:active{transform:translateY(0) scale(.965)}
#shareRunBtn:focus-visible,#restartBtn:focus-visible{
  outline:2px solid rgba(229,67,61,.6);outline-offset:3px;
}

/* ---- 分享本局战报：通透次级玻璃 ---- */
#shareRunBtn{
  min-height:46px;border-radius:999px;
  border:1px solid rgba(255,255,255,.80);
  background:rgba(255,255,255,.40);
  background-image:linear-gradient(160deg,rgba(255,255,255,.66),rgba(255,255,255,.12) 64%);
  -webkit-backdrop-filter:blur(14px) saturate(1.35);
          backdrop-filter:blur(14px) saturate(1.35);
  color:#544C3E;font-size:14px;font-weight:800;letter-spacing:2px;
  box-shadow:0 8px 22px rgba(80,70,50,.12),inset 0 1px 0 rgba(255,255,255,.94);
}
@media (hover:hover) and (pointer:fine){
  #shareRunBtn:hover{
    border-color:rgba(255,255,255,.98);
    box-shadow:0 12px 28px rgba(80,70,50,.16),inset 0 1px 0 rgba(255,255,255,.99);
  }
}

/* ---- 再来一次：墨玉主按钮 ---- */
#restartBtn{
  min-height:52px;border-radius:999px;
  border:1px solid rgba(255,255,255,.20);
  background-color:rgba(44,40,33,.92);
  background-image:
    linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 44%),
    linear-gradient(180deg,rgba(64,58,48,.94),rgba(32,29,24,.92));
  color:#FFF;font-size:16px;font-weight:800;letter-spacing:4px;
  box-shadow:0 14px 30px rgba(38,32,22,.30),inset 0 1px 0 rgba(255,255,255,.22);
}
@media (hover:hover) and (pointer:fine){
  #restartBtn:hover{
    box-shadow:
      0 18px 38px rgba(38,32,22,.34),
      0 0 0 1px rgba(206,166,84,.34),
      0 0 26px rgba(206,166,84,.22),
      inset 0 1px 0 rgba(255,255,255,.26);
  }
}
#restartBtn::after{
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.30),rgba(255,255,255,0));
}

/* 状态提示紧贴分享按钮，别把两个按钮撑开 */
#endShareStatus{min-height:0;padding:6px 6px 0}

/* 无障碍：尊重减少动效 */
@media (prefers-reduced-motion:reduce){
  #endCard,#endCard > *{animation:none}
  #shareRunBtn,#restartBtn,
  #shareRunBtn::before,#shareRunBtn::after,
  #restartBtn::before,#restartBtn::after{transition:none}
  #shareRunBtn:hover,#restartBtn:hover{transform:none}
}

/* ---- 通透度终调（覆盖前值，置于末尾确保生效） ---- */
#overlay{background:rgba(247,243,234,.56)}
#endCard{
  background:rgba(255,255,255,.25);
  background-image:
    linear-gradient(152deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,.08) 34%,rgba(255,255,255,0) 52%),
    radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);
}

/* ---- 按钮通透度终调：主按钮改墨玉玻璃，次按钮再透一档 ---- */
#shareRunBtn{
  background:rgba(255,255,255,.34);
  background-image:linear-gradient(160deg,rgba(255,255,255,.60),rgba(255,255,255,.10) 64%);
}
#restartBtn{
  background-color:rgba(42,38,31,.74);
  background-image:
    linear-gradient(160deg,rgba(255,255,255,.20),rgba(255,255,255,0) 46%),
    linear-gradient(180deg,rgba(64,58,48,.80),rgba(30,27,22,.76));
  -webkit-backdrop-filter:blur(12px) saturate(1.25);
          backdrop-filter:blur(12px) saturate(1.25);
  border-color:rgba(255,255,255,.26);
}

/* ================= 天机一转 · 星盘主题 ================= */
.theme-star{
  --paper:#080B14;--paper2:#0E1422;--card:#151B2B;
  --ink:#E6DED0;--faint:#9A927F;--line:rgba(212,175,55,.22);
  --ink-faint:#7F7868;--ink-dim:#9A927F;
  --glass:rgba(21,27,43,.55);--glass-hi:rgba(28,36,56,.80);
  --glass-line:rgba(212,175,55,.30);--glass-edge:rgba(212,175,55,.12);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45);
  --glass-inset:inset 0 1px 0 rgba(212,175,55,.10);
  --gold:#D4AF37;--gold-hi:#E8C56A;--gold-soft:rgba(212,175,55,.14);
  --ok:#5FA88F;--danger:#C9544A;--blue:#5B7FB8;--purple:#6B4E8C;
  --f-title:'Songti SC','STSong','SimSun',serif;
  --f-num:'SF Mono','Consolas','Menlo',monospace;
  color-scheme:dark;
}
.theme-star body{background:var(--paper);color:var(--ink)}

/* —— 背景：星云 —— */
.theme-star #bg{
  background:
    radial-gradient(46% 30% at 16% 8%, rgba(91,127,184,.18), transparent 68%),
    radial-gradient(40% 26% at 86% 12%, rgba(212,175,55,.16), transparent 70%),
    radial-gradient(50% 32% at 78% 92%, rgba(107,78,140,.18), transparent 72%),
    radial-gradient(44% 28% at 10% 90%, rgba(95,168,143,.10), transparent 72%),
    radial-gradient(60% 40% at 50% 50%, rgba(255,255,255,.03), transparent 70%),
    linear-gradient(165deg,#0B0F1A 0%,#101728 46%,#0A0D16 100%);
  box-shadow:none;
}

/* —— 标题：金线夹宋体 —— */
.theme-star #titleText{
  background:transparent;border:none;box-shadow:none;border-radius:0;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  color:var(--gold-hi);font-family:var(--f-title);
  font-size:20px;letter-spacing:8px;padding:10px 0 4px;position:relative;
}
.theme-star #titleText::before,.theme-star #titleText::after{
  content:'';position:absolute;top:52%;width:34px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
}
.theme-star #titleText::before{right:100%;margin-right:16px;transform:scaleX(-1)}
.theme-star #titleText::after{left:100%;margin-left:16px}
.theme-star #verTag{margin-left:52px;color:var(--gold);border-color:rgba(212,175,55,.3);background:transparent;letter-spacing:1px}

/* —— HUD：符牌网格 —— */
.theme-star #hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0 4px}
.theme-star .hudItem{
  flex-direction:column;gap:2px;padding:7px 4px;border-radius:5px;
  background:rgba(21,27,43,.72);border:1px solid var(--glass-line);
  box-shadow:inset 0 0 0 1px rgba(212,175,55,.06);position:relative;
}
.theme-star .hudItem::after{
  content:'';position:absolute;inset:3px;border:1px solid rgba(212,175,55,.10);
  border-radius:3px;pointer-events:none;
}
.theme-star .hudLabel{font-size:10px;color:var(--ink-faint,#6B6455);letter-spacing:2px}
.theme-star .hudVal{font-size:13px;color:var(--gold-hi);font-family:var(--f-num);font-weight:700}
.theme-star #tyRow{color:var(--faint)}
.theme-star #tyNow{color:var(--gold)}

/* —— 叙述条 —— */
.theme-star #sayBox{
  background:rgba(21,27,43,.92);border:1px solid var(--glass-line);
  border-left:2px solid var(--gold);border-radius:6px;color:var(--ink);
  font-size:14.5px;line-height:1.8;
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .theme-star #sayBox{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2)}
}
.theme-star #sayBox.gold{color:var(--gold-hi);font-weight:700}
.theme-star #sayBox.bad{color:#E08A80}

/* —— 结果区：卦牌 —— */
.theme-star #resTitle{color:var(--ink-faint,#6B6455);font-size:12.5px;letter-spacing:3px}
.theme-star #resMain{
  font-family:var(--f-title);font-size:30px;font-weight:900;color:var(--gold-hi);
  opacity:.30;text-shadow:0 0 22px rgba(212,175,55,.35);
  padding:4px 16px;border-radius:6px;position:relative;
}
.theme-star #resMain.pop{
  opacity:1;transform:scale(1.06);
  background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.03));
  box-shadow:0 0 0 1px var(--glass-line),0 0 30px rgba(212,175,55,.22),inset 0 0 22px rgba(212,175,55,.07);
}
.theme-star #resMain .rsub{color:var(--ink-dim,#9A927F)}

/* —— 转盘 —— */
.theme-star #ptr{display:none}
.theme-star .sector{stroke:rgba(212,175,55,.42);stroke-width:1;transition:stroke .2s,stroke-width .2s,fill-opacity .2s}
.theme-star .sector.win{stroke:var(--gold-hi);stroke-width:2.6;fill-opacity:.72;filter:drop-shadow(0 0 6px rgba(232,197,106,.55))}
.theme-star .sector.rigSel{stroke:var(--gold-hi);stroke-width:3}
.theme-star .wheelTxt{fill:#E6DED0}
.theme-star #svg.settled #ringFx{animation:ringPulse .95s cubic-bezier(.18,.8,.25,1) 1}
@keyframes ringPulse{0%{opacity:0;transform:scale(1)}18%{opacity:.9}100%{opacity:0;transform:scale(1.035)}}

/* —— 盘面刻度 / 指针 / 中心盘（starThemeInit 绘制） —— */
.theme-star #dialG,.theme-star #coreG{pointer-events:none}
.theme-star .dialRing{fill:none;stroke:rgba(212,175,55,.26);stroke-width:1}
.theme-star .dialTick{stroke:rgba(212,175,55,.38);stroke-linecap:round}
.theme-star .dialTick.major{stroke:rgba(232,197,106,.72)}
.theme-star #ringFx{fill:none;stroke:var(--gold-hi);opacity:0;transform-box:view-box;transform-origin:340px 392px;vector-effect:non-scaling-stroke;stroke-width:1.6}
.theme-star .ptrTri{fill:var(--gold-hi)}
.theme-star .coreFace{fill:#0E1422;stroke:rgba(232,197,106,.75);stroke-width:1.4}
.theme-star .coreInner{fill:none;stroke:rgba(212,175,55,.45);stroke-width:1}
.theme-star .coreGlyph{fill:var(--gold-hi);font-family:var(--f-title);font-size:30px;font-weight:700;text-anchor:middle}
.theme-star .coreDot{fill:rgba(232,197,106,.8)}

/* —— 结果大字 —— */
.theme-star #flash{color:var(--gold-hi);text-shadow:0 0 24px rgba(232,197,106,.50),0 2px 0 rgba(0,0,0,.55)}
.theme-star #flash .fs{color:rgba(230,222,208,.72);text-shadow:0 0 12px rgba(0,0,0,.55)}

/* —— 操作栏 —— */
.theme-star .opSide,.theme-star .opSide.sel,.theme-star #rerollBtn{
  background:rgba(21,27,43,.62);border:1px solid var(--glass-line);color:var(--faint);
  box-shadow:0 3px 12px rgba(0,0,0,.35),var(--glass-inset);
}
.theme-star .opSide.on,.theme-star .opSide.sel.on{
  background:linear-gradient(180deg,rgba(232,197,106,.92),rgba(176,140,38,.92));
  border-color:rgba(232,197,106,.85);color:#0B0F1A;
  box-shadow:0 4px 16px rgba(212,175,55,.22),inset 0 1px 0 rgba(255,255,255,.35);
}
.theme-star #rerollBtn{color:var(--gold);border-color:rgba(212,175,55,.55)}
.theme-star #rerollBtn.ready{box-shadow:0 0 18px rgba(212,175,55,.30),var(--glass-inset)}
.theme-star #rerollBtn:disabled{opacity:.32}
.theme-star #spinBtn{
  background:linear-gradient(180deg,#F0D488 0%,#D4AF37 46%,#B08A24 100%);
  border:1px solid rgba(255,232,170,.55);color:#0B0F1A;letter-spacing:2px;
  box-shadow:0 10px 26px rgba(212,175,55,.25),inset 0 1px 0 rgba(255,255,255,.55);
}
.theme-star #spinBtn.ready{opacity:1}
.theme-star #keyHint{color:#6E6758}

/* —— 属性 / 播报面板 —— */
.theme-star #panel,.theme-star #logPanel{
  background:rgba(21,27,43,.62);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:var(--glass-shadow),var(--glass-inset);
}
.theme-star #pTitle{color:var(--gold);border-bottom-color:rgba(212,175,55,.22)}
.theme-star .pRow b{color:var(--ink)}
.theme-star .pRow span{color:var(--faint)}
.theme-star .logLine{color:var(--ink)}
.theme-star .logLine.good{color:#7DC4A6}
.theme-star .logLine.bad{color:#E08A80}
.theme-star .logLine.gold{color:var(--gold-hi)}
.theme-star .logLine.battle{color:#B79AD6}
.theme-star .logLine.sys{color:#8E887A}

/* —— 浮层 / 卡片 —— */
.theme-star #overlay{background:rgba(8,11,20,.84);-webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1)}
.theme-star #logOverlay,.theme-star #achvOverlay,.theme-star #dexOverlay{background:rgba(8,11,20,.95)}
.theme-star #endCard,.theme-star #logCard,.theme-star #achvCard,.theme-star #dexCard{
  background:linear-gradient(160deg,rgba(28,36,56,.96),rgba(15,21,35,.96));
  border-color:rgba(212,175,55,.34);
  box-shadow:0 28px 70px rgba(0,0,0,.62),var(--glass-inset);
}
.theme-star #endTitle{
  background-image:linear-gradient(180deg,#F0E7D6 0%,#E8C56A 62%,#C79A2E 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.theme-star #endQuote,.theme-star .endSec{color:var(--faint)}
.theme-star #endAttrs{color:var(--ink)}
.theme-star #endChron{color:#C9C1B1}
.theme-star #endMerits{color:#B79AD6}
.theme-star #endSeed{border-top-color:rgba(212,175,55,.22)}
.theme-star #endSeed .seedLine{color:var(--ink)}
.theme-star #endSeed .seedLine b{color:var(--gold-hi)}
.theme-star #endSeed .seedHint{color:var(--faint)}
.theme-star #logCard h3,.theme-star #achvCard h3,.theme-star #dexCard h3{color:var(--gold)}
.theme-star #logCard .chronLine{color:#C9C1B1}
.theme-star #logList{color:var(--faint)}
.theme-star #achvCard .achvLine,.theme-star #dexCard .achvLine{color:var(--ink);border-bottom-color:rgba(212,175,55,.14)}
.theme-star #achvCard .achvLine span,.theme-star #dexCard .achvLine span{color:var(--faint)}
.theme-star #dexTabs button{background:rgba(21,27,43,.72);color:var(--faint);border-color:var(--glass-line)}
.theme-star #dexTabs button.on{background:linear-gradient(180deg,#E8C56A,#C79A2E);color:#0B0F1A;border-color:transparent}
.theme-star #achvToast{background:rgba(21,27,43,.96);color:var(--gold-hi);border:1px solid var(--glass-line);box-shadow:0 6px 20px rgba(0,0,0,.55)}

/* —— 分享 / 终局按钮 —— */
.theme-star #shareGameBtn,.theme-star #shareRunBtn{
  background:rgba(21,27,43,.56);border-color:rgba(212,175,55,.34);color:var(--gold);
  box-shadow:0 4px 14px rgba(0,0,0,.35),var(--glass-inset);
}
.theme-star #shareRunBtn{color:var(--gold-hi)}
.theme-star #restartBtn{
  background-color:rgba(176,140,38,.92);
  background-image:linear-gradient(160deg,#F0D488 0%,#D4AF37 48%,#A87C1E 100%);
  color:#0B0F1A;border-color:rgba(255,232,170,.5);
  box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 26px rgba(212,175,55,.16),inset 0 1px 0 rgba(255,255,255,.45);
}
.theme-star #shareStatus,.theme-star #endShareStatus{color:var(--faint)}
.theme-star #logClose,.theme-star #achvClose,.theme-star #dexClose{background:linear-gradient(180deg,#E8C56A,#C79A2E) !important;color:#0B0F1A !important}
.theme-star #logClose,.theme-star #achvClose,.theme-star #dexClose{font-weight:700}

/* —— 焦点 / 滚动条 —— */
.theme-star button:focus-visible,.theme-star select:focus-visible,.theme-star input:focus-visible{outline-color:rgba(232,197,106,.62)}
.theme-star #sayBox::-webkit-scrollbar-thumb,.theme-star #logPanel::-webkit-scrollbar-thumb,.theme-star #endChron::-webkit-scrollbar-thumb{background:rgba(212,175,55,.28)}

/* —— 低配 / 降透明兜底：保持暗色，不回退成白卡 —— */
html.perf-low.theme-star #titleText{background:transparent;border:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
html.perf-low.theme-star #sayBox,
html.perf-low.theme-star #panel,
html.perf-low.theme-star #logPanel,
html.perf-low.theme-star #endCard,
html.perf-low.theme-star #logCard{background:rgba(21,27,43,.94)}
@media (prefers-reduced-transparency:reduce){
  .theme-star #sayBox,.theme-star #panel,.theme-star #logPanel,
  .theme-star #endCard,.theme-star #logCard{background:rgba(21,27,43,.94)}
}

/* ============ 天机一转 · 结局翻牌 ============ */
.theme-star #overlay{perspective:1400px}
.theme-star #endCard{position:relative}
.theme-star #overlay:not(.hidden){animation:ovFade .32s ease-out}
@keyframes ovFade{from{background:rgba(8,11,20,0)}to{background:rgba(8,11,20,.84)}}

@keyframes endCardFlip{
  0%  {opacity:0;transform:translateY(20px) scale(.92) rotateX(10deg)}
  55% {opacity:1}
  100%{opacity:1;transform:none}
}
.theme-star #endCard.flipIn{animation:endCardFlip .52s cubic-bezier(.2,.85,.3,1) backwards}

.theme-star #endCard::before{
  content:'';position:absolute;left:50%;top:0;height:2px;width:0;
  background:linear-gradient(90deg,transparent,#E8C56A,transparent);
  transform:translateX(-50%);border-radius:2px;pointer-events:none;opacity:0;
}
.theme-star #endCard.flipIn::before{animation:endLine .72s .10s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes endLine{0%{width:0;opacity:0}35%{opacity:1}100%{width:82%;opacity:.85}}

.theme-star #endCard.flipIn #endTitle{animation:endTitleIn .7s .16s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes endTitleIn{
  0%  {opacity:0;letter-spacing:16px;transform:translateY(6px)}
  100%{opacity:1;letter-spacing:6px;transform:none}
}
.theme-star #endCard.flipIn > *{animation-delay:.10s}
.theme-star #endCard.flipIn > *:nth-child(1){animation-delay:.10s}
.theme-star #endCard.flipIn > *:nth-child(2){animation-delay:.14s}
.theme-star #endCard.flipIn > *:nth-child(3){animation-delay:.18s}
.theme-star #endCard.flipIn > *:nth-child(4){animation-delay:.22s}
.theme-star #endCard.flipIn > *:nth-child(5){animation-delay:.26s}
.theme-star #endCard.flipIn > *:nth-child(6){animation-delay:.30s}
.theme-star #endCard.flipIn > *:nth-child(7){animation-delay:.34s}
.theme-star #endCard.flipIn > *:nth-child(8){animation-delay:.38s}
.theme-star #endCard.flipIn > *:nth-child(9){animation-delay:.42s}
.theme-star #endCard.flipIn > *:nth-child(10){animation-delay:.46s}

@media (prefers-reduced-motion:reduce){

  characterBoundaries:['元始仙尊作为时代历史锚点与道统源头，不安排玩家必然与其本人相遇。','不擅自添加原著未确认的元始仙尊同伴、弟子名单或基层统治者。','异人来使为游戏原创使团，不对应原著某个已知人物或固定事件。'],
  factionBoundaries:['人族基层聚落与异人势力压力构成时代环境；具体村落、使团与气脉分配争端均为游戏原创。','天庭及门派制度作为元始仙尊留下的历史影响呈现，不将后世天庭全部组织细节提前到本时期。'],
  acts:[

   {id:'growth',name:'人物成长',plot:'玩家在荒林寻蛊与气道残篇之间作出取舍；升仙后再以古炼炉遗址、气道洞府、三气古井、三气初炼和开炉试蛊检验积累。成长来自探索、炼制与承担风险，而不是连续抽到免费境界提升。',goal:'通过探索、炼蛊和正式历练形成自己的气道与炼道根基。',events:['荒林寻蛊','气道残篇','荒坡寻蛊','古寨炼摊'],travelEvents:['古炼炉遗址','气道洞府','三气古井'],trialEvents:['三气初炼','开炉试蛊'],basis:'游戏原创设定 / 合理推断（气道传承可能留有残篇）',boundary:'不把凡人阶段的零散心得包装成尊者完整传承或原著秘法；古炉与洞府均为游戏原创场景。'},
   {id:'conflict',name:'时代矛盾',plot:'天地人三气的争论落到气脉资源分配，气脉分田引出旧契，旧契又揭出夜袭气渠的危机；异人来使则让玩家面对交易与族群戒备。三段经历有前后因果，最终以守渠、设伏或撤离收束。',goal:'在资源争端与族群压力之间作出取舍，并亲自承担一次有明确胜负后果的战斗。',events:['天地人三气论','气脉分田','异人来使','气脉旧契','气脉夜袭','气脉巡渠'],basis:'原著明确内容（天地人三气体系、人族与异人背景）＋游戏原创场景',boundary:'街头论争、气脉争端、使团、旧契与夜袭均为游戏原创，不宣称是原著记载的具体史事。'},
   {id:'turning',name:'重大转折',plot:'一次性的三气异动让玩家意识到天地人三气并非市井争论中的简单名目；三气碑与气道问心进一步迫使玩家判断气与自身修行的关系，元始残炉则把感悟推向真正的试炼。',goal:'判断三气异象对自身修行的意义，并在传承遗迹前承担风险。',events:['三气异动'],travelEvents:['三气碑'],trialEvents:['气道问心','元始残炉'],basis:'游戏原创设定（以原著天地人三气体系为背景）',boundary:'不把玩家感知的异象说成原著中某次天地大劫或元始仙尊的关键历史事件；碑刻与残炉遭遇为游戏原创。'},
   {id:'ending',name:'时代终局',plot:'时代收束以玩家个人道路为中心：炼道论榜检验公开论道与炼制成果，随后通过元始时期专属收束、争尊尝试与个人结局，结算玩家在气道、炼道及三气方向上的选择。元始仙尊的原著历史不因玩家结局而被替代。',goal:'决定守道、传法、归隐或争尊；失败与退让也应是有效收束。',events:[],trialEvents:['炼道论榜'],route:"ysFinale() / tryEraZun(\'ys\')",basis:'游戏原创玩家结局（以元始仙尊的原著道统为背景）',boundary:'玩家成就只属于本局分支，不改写元始仙尊本人创立天庭、开创气道的既定历史。'},
   {id:'legacy',name:'历史遗产',plot:'时代余烬、元始遗训与天庭旧制呈现后世如何理解元始仙尊的历史影响；三气归来迹则让玩家决定是否把个人感悟化为杀招雏形。天庭创立及门派制度属于原著历史锚点；遗训石壁、基层讲述与历练场景均按游戏原创处理。',goal:'辨认真正的历史影响与后人附会，决定自己留下何种传承与技艺。',events:['时代余烬·元始','元始遗训','天庭旧制'],trialEvents:['三气归来迹'],basis:'原著明确内容（元始创立天庭、推动门派制度）＋游戏原创历史回响',boundary:'元始遗训不得作为元始仙尊原著原话；三气归来为玩家原创杀招路线，不是元始仙尊原著招式。'}

 1:{

  historicalAnchor:'远古时代；星宿仙尊承接元始仙尊之后，以智道为主、兼修星道，辅佐天庭并留下深远布局。天庭的建立早于本时期，不把天庭初创与星宿时期混为一谈。',

  characterBoundaries:['星宿仙尊的历史作用以原著明确背景呈现；凡人玩家不安排与星宿仙尊本人必然相遇。','星宿意志只在对应关键历练条件满足后作为意志/残响出现，不等同星宿仙尊本人仍在世。','旧亭棋手、书院先生、观星人、天庭外门执事及传令者均为游戏原创人物，不冒充原著人物。'],
  factionBoundaries:['天庭已由元始仙尊创立，星宿时期呈现其延续、扩展与智道/星道体系影响；不得把后世十大古派及后期天庭完整组织形态提前。','地方书院、驿站星门、招贤与外门考核均为游戏原创制度侧写；天庭的历史地位与星宿辅佐天庭属于原著背景。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从观星夜课、天庭招贤或地方驿站的星象异闻进入时代。开局重点不是立刻得到仙尊布局，而是认识天庭已经存在的秩序：有人希望借天庭谋求出路，也有人只想在星象与商路变化中保住生计。',goal:'建立玩家在星宿时代的社会位置，分清天庭制度背景与基层原创遭遇。',events:['天庭招贤'],basis:'原著明确内容（天庭由元始仙尊创立、星宿承接并辅佐天庭）＋合理推断/游戏原创场景',boundary:'不把玩家写成星宿仙尊亲传，不把天庭招贤流程说成原著明确制度。'},
   {id:'growth',name:'人物成长',plot:'玩家在观星、棋局与智道论道中积累判断能力。星野观测提供凡人可理解的星象经验；星宿棋痕与星棋续局则让玩家接触后人对智道布局的揣摩，但棋盘不是星宿仙尊的真实布局原件。升仙后可继续探索星象福地外围，并接受星宿棋局等专属历练。',goal:'让智道、星道成长来自观察、推演与历练，不把凡人见闻夸大为尊者真传。',events:['观星夜课','棋盘残局','智道论道','智道书院','星野观测','星宿棋痕','星棋续局'],travelEvents:['星象福地外围'],trialEvents:['星宿棋局','天庭外门试炼','定仙游遗迹'],basis:'游戏原创设定 / 合理推断（以星宿仙尊智道、星道背景为依托）',boundary:'旧亭棋痕与民间棋局仅是后人揣摩；不得宣称玩家复原星宿仙尊真实棋局。'},
   {id:'conflict',name:'时代矛盾',plot:'天庭招贤带来资源与名额竞争，星门传令和地方星象异变又使驿道、传讯与修行秩序承压。玩家需要判断该协助传令、查验消息，还是保留自身力量；冲突来自制度执行与地方利益，不是提前揭露星宿对三位魔尊的全部布局。',goal:'让玩家面对天庭秩序在地方的实际影响，并承担一次信息或资源选择的后果。',events:['星门传令'],basis:'游戏原创设定（以天庭延续与星宿辅佐天庭的原著背景为参照）',boundary:'驿站急令、星门检查及地方利益冲突均为原创，不作为原著记载的具体天庭政令。'},
   {id:'turning',name:'重大转折',plot:'星象异变让玩家发现，天象并非总能被旧图解释。推演一劫、天庭残图与星宿意志构成逐级深入的历练：从推演自身劫数，到辨认残图风险，最终才可能接触星宿意志。每一步都需能力与门槛，不把意志残响写成仙尊本人现身。',goal:'由普通星象观察推进到高风险推演，形成玩家自己的智道/星道道路选择。',events:['星象异变'],trialEvents:['推演一劫','天庭残图','星宿意志'],basis:'游戏原创设定（以原著星宿仙尊布局与意志遗留为背景）',boundary:'具体异变、残图与玩家接触意志的过程属于游戏剧情；不声称残图是原著真实天庭总图。'},
   {id:'ending',name:'时代终局',plot:'星宿时期的终局回到玩家自身：天庭记名、星宿真意、星念与智道/星道选择决定不同收束。玩家可以留在天庭体系、另辟道路、封存真意或归隐；无论结局如何，都不改变星宿仙尊辅佐天庭、阻挡魔尊的原著历史。',goal:'以玩家自己的修行路线与选择收束本局，不替代星宿仙尊的历史使命。',events:[],route:'xxFinale() / tryEraZun(\'xx\')',basis:'游戏原创玩家结局（以星宿仙尊原著历史作用为背景）',boundary:'玩家的天庭记名、星宿真意及结局均为本局原创分支，不改写原著尊者布局。'},
   {id:'legacy',name:'历史遗产',plot:'天庭旧册、星轨刻石与时代余烬呈现后人如何记录星宿时期。旧册的缺页、驿道刻石与民间侧写都是游戏原创；原著明确的历史遗产是星宿仙尊以智道辅佐天庭并留下深远影响，而不是这些具体物件。',goal:'辨认真实历史影响与后世附会，决定是否将自己的推演方法传给后来者。',events:['天庭旧册','星轨刻石','时代余烬·星宿'],basis:'原著明确内容（星宿辅佐天庭、布局阻挡三位魔尊）＋游戏原创历史回响',boundary:'不把天庭旧册、星轨刻石或玩家所得残图说成原著明确记载的星宿遗物。'}

 2:{

  factionBoundaries:['疯魔窟与无极求道是原著历史锚点；外围集市、役工招募、北原行脚修士及临时聚落均为游戏原创。','不提前引入后世天庭完整组织、长生天后期势力形态或方源时代的疯魔窟探索者。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从北原风雪、窟外役工与道场外围的日常进入无极之世。疯魔窟仍是时代中最醒目的求道工程，但玩家接触到的只是外围秩序、临时营地和生计压力；不把凡人阶段写成直接参与无极推衍天道。',goal:'交代北原环境与玩家在疯魔窟外围的身份，建立“靠近道场但不进入核心”的边界。',events:['疯魔窟役工','道场役工','雪原借宿'],basis:'原著明确内容（无极营建疯魔窟）＋游戏原创基层场景',boundary:'招募、外门役工、岩棚借宿均为原创，不宣称原著记载过这些具体事件。'},
   {id:'growth',name:'人物成长',plot:'玩家在九虚残页、无极石壁与阵材易市之间辨认真假：阵纹可以提供学习线索，却不等于完整阵图；普通石料也不能因为靠近疯魔窟就被当作真传。灰袍人的“一块石头”问答则作为一段独立原创人物互动。',goal:'通过辨材、识阵与谨慎选择积累修行经验，不把零散残件包装成无极真传。',events:['九虚残页','无极石壁','一块石头','阵材易市'],basis:'原著明确内容（疯魔九虚阵与无极求道背景）＋游戏原创遭遇',boundary:'残页、石壁、集市阵材和玩家所得均为原创，不是原著明确遗物或真传。'},
   {id:'conflict',name:'时代矛盾',plot:'道场营建与周边生计并非总能兼顾。魔音初啼使行脚者对窟外异响心生戒备，凶地兽潮又让临时营地面对真实伤亡风险；玩家需要在自保、救人和保全资源之间取舍。凡人时期与无极的相遇仍是小范围原创支线，不代表玩家进入尊者布局。',goal:'让玩家面对窟外生存压力与个人选择，并保留偶遇人物支线的独立性。',events:['魔音初啼','凶地兽潮','偶遇凡人时期无极'],basis:'原著明确内容（疯魔窟魔音、无极求道背景）＋游戏原创冲突',boundary:'采药队、兽潮、魔音初啼的具体场景及偶遇互动均为原创，不改变原著历史。'},
   {id:'turning',name:'重大转折',plot:'九虚回响把玩家从市井传闻带到阵法危险边缘。升仙后，疯魔窟·初探、元境初封、魔尊落子、九虚反噬与光阴浮冰构成递进历练：先确认自身能否进入，再面对任务、阵法反噬与浮冰取舍。每一步都保留既有门槛与结算。',goal:'将凡人阶段的零散见闻推进为升仙后的高风险历练，承接原有无极线与关键历练系统。',events:['九虚回响'],trialEvents:['疯魔窟·初探','元境初封','魔尊落子','九虚反噬','光阴浮冰'],basis:'原著明确内容（疯魔九虚阵、元境、光阴浮冰及无极求道背景）＋游戏原创玩家历练',boundary:'关键历练是玩家原创分支；不改变无极推衍天道的原著目标、结果或历史顺序。'},
   {id:'ending',name:'时代终局',plot:'道场封门标记玩家所能接触的外围阶段告一段落。无论玩家选择离开、保留线索或继续追索，原有无极成尊尝试、再遇无极与后续时代结算仍按既有逻辑执行；不以普通玩家结局替代无极魔尊的历史。',goal:'收束玩家在疯魔窟外围的阶段经历，同时保留原有无极成尊尝试与后续分支入口。',events:['道场封门'],route:"tryEraZun('wj') / wujiReencounter() / era2LaterLife()",basis:'游戏原创玩家阶段收束（以无极魔尊原著历史为背景）',boundary:'不改写无极成尊、疯魔窟营建或后续历史节点；不新增自动触发的终局。'},
   {id:'legacy',name:'历史遗产',plot:'时代余烬·无极与石壁守夜记录后人如何理解疯魔窟和无极求道。前者只作原著历史背景下的凡人侧写，后者是玩家选择引出的原创后续；二者都不能被误认成无极本人留下的确切遗训。',goal:'区分原著历史锚点、后世传闻与玩家原创留痕。',events:['时代余烬·无极','石壁守夜'],basis:'原著明确内容（无极营建疯魔窟、推衍天道与永生之秘）＋游戏原创历史回响',boundary:'石壁、守夜人、石屑凭证与玩家后续均为原创，不作为原著真传或仙尊遗命。'}

 3:{
  eraIdx:3,eraName:'狂蛮魔尊时期',releaseVersion:'v1.85',status:'已完成第一轮重构',
  historicalAnchor:'上古时代；狂蛮魔尊开创力道、变化道，原著后续揭示其与兽人习俗、荒兽图腾及异人相关经历。不得把这些历史锚点等同于玩家所在部族的全部日常。',
  playerPosition:'玩家是荒原部族或周边聚落中的普通蛊师，在兽潮、狩猎、迁徙、分配与形态修行中求生；不是狂蛮魔尊本人、其亲历者或其必然传承人。',
  characterBoundaries:['狂蛮魔尊的原著经历只作历史锚点与后世回响；玩家的剥皮换衣、部族招婿、兽图与猎场经历均为原创，不得写成狂蛮本人真实经历。','兽人习俗、异人族群与荒兽图腾按原著已揭示背景呈现；不将所有部族等同兽人，也不把所有异人都写成同一阵营。','狂蛮意志与真传只通过既有关键历练及门槛触发，不让凡人阶段提前获得完整传承。'],
  factionBoundaries:['部族、猎队、临时盟誓与兽栏分配均为游戏原创基层组织；不得提前套用后世北原黄金家族、王庭福地或巨阳体系。','异人猎场只呈现玩家视角下的足迹、工具与冲突，不把其写成原著某次狂蛮本人参与的战争。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从兽潮避难与部族迁徙进入荒原。先要判断土墙能否守住、队伍该往何处撤，再在迁徙踏痕中辨认兽迹与人迹。开局强调活命和观察，不把玩家直接推入尊者传承。',goal:'建立荒原生存压力与玩家的基层身份，理解兽潮和迁徙对普通部族的影响。',events:['兽潮避难','迁徙踏痕'],basis:'游戏原创设定（荒兽、北原荒原与部族生存为时代背景）',boundary:'兽潮、土墙、迁徙路线与玩家护送均为原创场景，不指定为狂蛮魔尊本人经历。'},
   {id:'growth',name:'人物成长',plot:'玩家从剥皮换衣、生吃兽核与狂蛮兽图接触变化、力道及荒兽习性。变化道遗骨则提醒玩家，形态变化并非只有外形模仿，贸然追逐力量也可能留下难以解释的后果。升仙后再由变化试形、荒原遗骨等历练检验积累。',goal:'让力道与变化道成长来自观察、适应和承担风险，不把凡人见闻夸大成狂蛮真传。',events:['剥皮换衣','生吃兽核','狂蛮兽图','变化道遗骨'],travelEvents:['兽骨堆','变形草滩'],trialEvents:['变化试形','荒原遗骨'],basis:'原著明确内容（力道、变化道、兽人习俗与荒兽图腾背景）＋游戏原创玩家经历',boundary:'玩家所得兽图、遗骨与变化心得均为原创；不等同狂蛮本人披制兽皮、吞吃太古荒兽或形成图腾的原著经历。'},
   {id:'conflict',name:'时代矛盾',plot:'角力定份与兽骨分帐把强者优先的生存逻辑落到具体分配；部落招婿、部族盟誓又让个人去留与部族利益相互牵扯。异人猎场将族群戒备推向边界，但玩家看到的只是局部冲突，不掌握整个时代的族群真相。',goal:'面对资源分配、婚配与族群关系，选择承担冲突或保全自身。',events:['角力定份','部落招婿','部族盟誓','兽骨分帐','异人猎场'],basis:'游戏原创设定（以荒原部族、异人与兽人习俗的原著背景为参照）',boundary:'角力分配、招婿、盟誓与猎场追踪均为原创基层冲突，不作为原著明确部族制度或狂蛮史事。'},
   {id:'turning',name:'重大转折',plot:'变化走火让玩家亲眼看见形态失控的代价。升仙后，兽潮前锋、力道斗场、血皮之兆与狂蛮意志回响构成逐级试炼：从荒原战斗到力道与变化道选择，最终才可能触及狂蛮意志。',goal:'把凡人阶段的求生经验推进为升仙后的力道、变化道专属历练，并保留原有门槛与风险。',events:['变化走火'],travelEvents:['力祭台'],trialEvents:['兽潮前锋','力道斗场','血皮之兆','狂蛮意志回响'],basis:'原著明确内容（狂蛮开创力道、变化道及相关传承背景）＋游戏原创玩家历练',boundary:'关键历练是玩家原创分支；不改变狂蛮魔尊的历史，也不提前泄露后世完整传承。'},
   {id:'ending',name:'时代终局',plot:'兽图盟约收束玩家与部族之间的承诺。随后仍由原有狂蛮终局逻辑判断是否尝试成尊，并依据狂蛮真传、血皮传承、部落之婿、兽性标记及流派境界等既有条件结算个人结局。',goal:'让玩家决定留在部族、携眷迁徙或走向自己的修行道路；不替代狂蛮魔尊原著历史。',events:['兽图盟约'],route:"kmFinale() / tryEraZun('km')",basis:'游戏原创玩家结局（以狂蛮魔尊原著历史为背景）',boundary:'保留原有 kmFinale 与 tryEraZun 成尊条件、顺序及结算；玩家结局不改写狂蛮的原著经历。'},
   {id:'legacy',name:'历史遗产',plot:'时代余烬·狂蛮与变化道遗骨让玩家区分原著历史与后人附会：力道、变化道开创及狂蛮相关兽人习俗、荒兽图腾属于原著背景；具体遗骨与凡人迁徙、盐袋、火种和水源记忆只是原创侧写。',goal:'辨认原著历史锚点与游戏原创见闻，决定是否留下自己的荒原记录。',events:['时代余烬·狂蛮'],basis:'原著明确内容（狂蛮开创力道、变化道及后续揭示的兽人/荒兽图腾背景）＋游戏原创历史回响',boundary:'不得将变化道遗骨称作狂蛮遗骸或真传；时代余烬只作凡人侧写，不补写狂蛮未载的凡人经历。'}

 4:{
  eraIdx:4,eraName:'红莲魔尊时期',releaseVersion:'v1.86',status:'已完成第一轮重构',
  historicalAnchor:'上古时代；红莲魔尊以爱情蛊损伤宿命蛊，并留下与光阴长河、春秋蝉及红莲真传相关的后续布局。宿命蛊在红莲时期并未被彻底摧毁；其最终毁灭属于后来的宿命大战。',
  playerPosition:'玩家是红莲时代普通修行者，在城镇计时、家族旧约、宿命传闻与宙道异象中作出自己的选择；不是红莲魔尊的亲历者、弟子或真传继承人。',
  characterBoundaries:['红莲魔尊的历史行动只作为时代锚点与后世传闻，不安排玩家必然与红莲本人相遇。','春秋蝉重生是特定仙蛊与方源经历，不是普通人能够触发的日常能力；凡人事件中的昨日重影、老死复生均明确为游戏原创异象。','光阴飞刃虽为原著宙道杀招，但相关梦境传承指向中洲薄家/薄青，不列为红莲魔尊专属杀招或红莲真传。'],
  factionBoundaries:['城镇、摆渡人、漏刻匠、河灯会与改命小贩均为游戏原创基层人物/组织，不冒充原著势力。','红莲真传、光阴长河与春秋蝉只在原有升仙后游历、关键历练及门槛满足时出现；凡人事件不得直接授予真传、仙蛊或改写宿命的能力。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从城镇更漏失灵与更漏校时进入红莲之世。计时器失准、工匠争论与日常作息混乱都是基层生活问题；玩家先学会辨认人为故障与无法解释的异象，不把寻常漏刻当成光阴长河入口。',goal:'建立玩家在红莲时代城镇中的普通身份，先从时间秩序的日常问题认识宙道氛围。',events:['时漏失灵','更漏校时'],basis:'游戏原创设定（宙道与光阴长河为原著体系背景）',boundary:'漏刻停摆、匠人修补与城镇作息争议均为原创，不代表红莲魔尊曾在此地留下宙道设施。'},
   {id:'growth',name:'人物成长',plot:'玩家从飞刃传闻与红莲棋局接触市井对宙道、宿命与逆流河的想象。传闻可能借用了真实杀招或历史名词，却不能据此掌握光阴飞刃，也不能把商贩的旧地图当成红莲真传路线。',goal:'学会分辨原著历史名词、后世附会与市井骗局，积累自己的宙道见闻。',events:['飞刃传闻','红莲棋局'],basis:'原著明确内容（光阴飞刃、红莲与逆流河相关背景）＋游戏原创传闻',boundary:'光阴飞刃的相关梦境传承指向中洲薄家/薄青；地图与传闻均为原创，不让玩家实际习得该杀招或取得真传。'},
   {id:'conflict',name:'时代矛盾',plot:'老死复生与改命小贩把人们对生死、命数的恐惧推到街头：有人希望死者再开口，有人愿为一张改命符付出代价。河灯寄名则让失散、离世与远行者的名字重新引发争执；玩家必须决定如何面对他人的执念。',goal:'让玩家在真实的人情纠葛中处理宿命观念，不以超自然力量轻易解决生死与因果。',events:['老死复生','改命小贩','河灯寄名'],basis:'游戏原创设定（宿命蛊与红莲抗命历史为背景）',boundary:'死者坐起、改命符、河灯寄名与人物选择均为原创；不代表凡人复生、真正改写宿命或触及爱情蛊。'},
   {id:'turning',name:'重大转折',plot:'昨日重影与红莲夜雨让玩家遭遇无法用常理解释的短暂异象；光阴渡口则以寓言方式逼迫玩家面对是否愿意为昨日付出代价。升仙后，光阴裂隙、昨日重逢、飞刃试锋、红莲残瓣、定命一掷与红莲意志回响构成原有递进历练，仍按既有门槛结算。',goal:'把凡人时期的疑问推进为升仙后的宙道历练，同时守住普通人不能随意穿梭光阴的边界。',events:['昨日重影','红莲夜雨','光阴渡口'],travelEvents:['光阴渡口'],trialEvents:['光阴裂隙','昨日重逢','飞刃试锋','红莲残瓣','定命一掷','红莲意志回响'],basis:'原著明确内容（光阴长河、春秋蝉、红莲真传与宙道杀招背景）＋游戏原创玩家遭遇',boundary:'凡人渡口、昨日重影与红雨均为原创寓言；升仙后历练沿用原有触发条件，不将其改写成原著红莲历史事件。'},
   {id:'ending',name:'时代终局',plot:'红莲残瓣与渡口归信收束玩家个人的遗憾与承诺：残瓣只是玩家线索，不是红莲魔尊遗物；归信支线由玩家此前选择解锁。随后仍由原有 hlFinale 与 tryEraZun 判断玩家是否尝试成尊，并结算宙道终局。',goal:'让玩家决定放下昨日、追寻未竟之事或守住当下，同时保留原有红莲时代结局与成尊入口。',events:['红莲残瓣','渡口归信'],route:"hlFinale() / tryEraZun('hl')",basis:'游戏原创玩家结局（以红莲魔尊的原著历史为背景）',boundary:'保留原有 hlFinale、tryEraZun 成尊条件与奖励；玩家结局不改写红莲以爱情蛊损伤宿命蛊的历史，也不提前摧毁宿命蛊。'},
   {id:'legacy',name:'历史遗产',plot:'宿命旧说与时代余烬·红莲记录后人如何理解红莲魔尊。原著明确的历史锚点是红莲曾损伤宿命蛊并留下后续布局；民间祭师、说书版本与玩家听闻均为原创侧写。后世宿命大战中宿命蛊被方源摧毁，不属于本时代当下。',goal:'辨清红莲时期真实历史、后世结果与民间附会，决定如何记录这段历史。',events:['宿命旧说','时代余烬·红莲'],travelEvents:['红莲池残','昨日集市'],basis:'原著明确内容（红莲以爱情蛊损伤宿命蛊、留下红莲真传及后续布局）＋游戏原创历史回响',boundary:'不把宿命蛊受损写成当场毁灭；不把后世宿命大战、方源或凤九歌的关键行动提前到红莲时代。'}
  ]

 5:{
  eraIdx:5,eraName:'元莲仙尊时期',releaseVersion:'v1.87',status:'已完成第一轮重构',
  historicalAnchor:'中古时代；元莲仙尊以木道成尊，兼修画道，留下豆神宫及相关画道布置。豆神宫与帝君城在后世才合并为神帝城，不能把合并后的城池与壁画世界提前。天元宝莲的效用按蛊虫品阶区分：三转产出元石，六转天元宝皇莲产出仙元。',
  playerPosition:'玩家是中古时代中洲及其他地域的普通修行者、画坊学徒、灵圃看守或行脚蛊师；不是元莲仙尊本人、亲传弟子或豆神宫布局的核心参与者。',
  characterBoundaries:['元莲仙尊以木道成尊、兼修画道及留下豆神宫等历史锚点按原著背景呈现；不安排玩家必然与元莲本人相遇。','青莲、画坊、画工、托梦与灵圃支线均是玩家原创遭遇，不将画师冒充元莲弟子或把玩家作品称为尊者真迹。','豆神宫与帝君城后来合并为神帝城；元莲时代只按豆神宫及其画道布置处理，不出现完成形态的神帝城和壁画世界。','天元宝莲三转产出元石，晋升六转天元宝皇莲后才产出仙元；不得将凡蛊效果写成直接产出真元或仙元。'],
  factionBoundaries:['画坊、灵圃、采药人、矿彩商贩及地方水渠管理均为游戏原创基层场景，不冒充原著组织。','豆神宫属于元莲留下的原著历史背景；帝君城与神帝城的后续形成只作为后世历史，不提前作为本时期现成势力或建筑。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从中洲山谷的灵植采种与青莲初绽进入元莲之世。先辨认灵植成熟与母株保护，再从木道生机的日常表现认识这个时代的修行风貌。青莲只是原创遭遇，不是元莲仙尊遗迹。',goal:'建立玩家作为普通采药人或行脚蛊师的身份，以观察、采集和守护开启本时期经历。',events:['青莲初绽'],basis:'游戏原创设定（以元莲仙尊木道背景为时代参照）',boundary:'枯枝抽芽、灵植结种与玩家采集均为原创场景，不对应元莲仙尊本人经历或真传。'},
   {id:'growth',name:'人物成长',plot:'玩家在画壁留名、丹青问心与画道旧闻中接触画道；天元宝莲的市井仿品则让玩家学会辨认真实蛊虫效用。升仙后，青莲池、木道长阶、木心问根、画道夺锋与莲池论笔继续检验木道和画道积累。',goal:'让木道与画道成长来自辨识、临摹、守护和正式历练，不把凡人画作或仿品误当尊者传承。',events:['木灵采种','画壁留名','丹青问心','画道旧闻','木道新芽','画坊修卷','元莲画意','天元宝莲'],travelEvents:['青莲池','木道长阶'],trialEvents:['木心问根','画道夺锋','莲池论笔'],basis:'原著明确内容（元莲以木道成尊、兼修画道、天元宝莲一系）＋游戏原创玩家经历',boundary:'玩家所见画壁、画师与仿品均为原创；三转天元宝莲产出元石，六转天元宝皇莲才产出仙元。'},
   {id:'conflict',name:'时代矛盾',plot:'木脉争水把灵植生长与地方资源分配推到台前，画料失窃则让画坊学徒、管事与匠人陷入信任危机。玩家必须在查证、协调、作证和追索之间选择；冲突来自基层利益，不是豆神宫内部布局。',goal:'在水源、灵材与工坊生计的矛盾中作出选择，并承担由此产生的人情后果。',events:['木脉争水','画料失窃'],basis:'游戏原创设定（木道资源与画道工坊作为时代背景）',boundary:'水闸争端、画料失窃、学徒纠纷及各方人物均为原创，不改写元莲仙尊历史或豆神宫原著布局。'},
   {id:'turning',name:'重大转折',plot:'青莲托梦与画中天地把玩家从寻常画意带向更深的自我审视。梦中人影不确认为元莲意志；画中天地与枯木逢春等升仙后历练仍按原有门槛与结算推进，玩家只能走自己的木道、画道之路。',goal:'从凡人阶段的木画见闻转向升仙后的高风险历练，明确玩家经历与尊者历史的边界。',events:['青莲托梦'],travelEvents:['画中天地'],trialEvents:['枯木逢春'],basis:'游戏原创设定（以元莲画道布置与木道背景为参照）',boundary:'梦境、画坊修卷和画中天地均为玩家原创经历；不将梦中人认作元莲本人、意志或分身。'},
   {id:'ending',name:'时代终局',plot:'画工留名承接玩家此前对元莲画意的选择，收束与画工的交往及题跋去向。随后由既有 lotusFinale 与 tryEraZun 判断玩家是否争尊，并结算个人道路；玩家结局不替代元莲仙尊以木道成尊的原著历史。',goal:'决定续写天地、传画授徒或归于山林，保留原有元莲终局与成尊门槛。',events:['画工留名'],route:"lotusFinale() / tryEraZun('yl')",basis:'游戏原创玩家结局（以元莲仙尊的原著历史为背景）',boundary:'不改动 lotusFinale、tryEraZun 的原有条件、奖励与结算；玩家成就不改变元莲仙尊历史。'},

 6:{
  eraIdx:6,eraName:'盗天魔尊时期',releaseVersion:'v1.88',status:'已完成第一轮重构',
  historicalAnchor:'中古时代；本杰孙为天外之魔，开创偷道，兼擅宇道，毕生追寻故乡与空门；他与长毛老祖合作炼制遁空蛊，另有十道真传。遁空蛊虽炼成，却未能使本杰孙进入空门。',
  playerPosition:'玩家是中古时代西漠及跨域商路上的普通修行者、商队护卫、货栈帮工或行脚蛊师；不是本杰孙，不因见闻自动成为天外之魔，也不是长毛老祖的必然继承人。',
  characterBoundaries:['本杰孙的天外之魔身份、开创偷道、追寻故乡与空门，以及与长毛老祖合作炼制遁空蛊，作为原著历史锚点呈现；不安排玩家必然与本杰孙本人相遇。','盗天十道真传的继承门槛为天外之魔；不得将这一门槛扩大到所有普通偷道/宇道传承，也不得让普通玩家仅凭选择取得十道真传。','遁空蛊确已炼成，但未能帮助本杰孙进入空门；玩家拾得的残图、梦境和门缝异象均为原创，不是仙蛊配方或真实空门入口。','长毛老祖与盗天、巨阳均有炼蛊交集；本时期的老人、毛民炼场与玩家对话按原创场景处理，不把长毛老祖与后世琅琊地灵混同。'],
  factionBoundaries:['西漠商队、跨域货栈、墨人城夜市及雪人潜入事件均为玩家视角下的原创基层场景；不据此补写原著未载的商队组织或异人战争。','不提前引入巨阳仙尊后期的北原黄金血脉、王庭福地与长生天完整势力形态；长毛老祖跨越盗天、巨阳两期的合作只作为人物时间边界。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从西漠商路与荒漠夜宿进入盗天之世。驼铃夜宿让玩家先面对水囊、驼兽与商队分工；指缝里的风则以一线异光留下关于门与远方的疑问。两者都只是普通人的旅途经历，不意味着真实空门就在眼前。',goal:'建立玩家在中古跨域商路上的普通身份，先从行旅生存与陌生异象认识时代。',events:['驼铃夜宿','指缝里的风'],basis:'游戏原创设定（以西漠商旅、空门传闻与盗天追寻归乡的原著背景为参照）',boundary:'夜宿商队、水囊争执与指缝异光均为原创；不将异光认定为空门入口，也不写成盗天本人留下的现场。'},
   {id:'growth',name:'人物成长',plot:'玩家在街市无影、盗天遗梦与遁空蛊残图之间逐渐理解偷道与宇道的危险边界：易容行窃只是凡人经历，梦中本杰孙与护道人沙枭是游戏原创梦境，残图也不能复原遁空蛊。升仙后再由黑市·见面不相识、长毛老祖·三次炼蛊与推杯换盏检验玩家的流派积累。',goal:'让偷道、宇道成长来自观察、辨伪与承担代价，不把凡人见闻直接变成尊者真传。',events:['街市无影','盗天遗梦','遁空蛊残图'],travelEvents:['黑市·见面不相识'],trialEvents:['长毛老祖·三次炼蛊','推杯换盏'],basis:'原著明确内容（本杰孙开创偷道、与长毛老祖合作炼蛊）＋游戏原创玩家经历',boundary:'梦境、街市行窃、残图与玩家所得均为原创；不等同习得见面不相识仙道杀招或获得遁空蛊配方。'},
   {id:'conflict',name:'时代矛盾',plot:'六转哄八转与雪人夜行把玩家卷入强者交涉和异人城邦冲突；异域账册则让跨域贸易中的货物去向、经手责任与商路信任成为现实问题。玩家面对的只是局部利益冲突，不掌握本杰孙的归乡布局，也不替代原著中的异人历史。',goal:'在强弱悬殊的交涉、异人冲突与商贸纠纷中作出选择，承担人情或资源后果。',events:['六转哄八转','雪人夜行','异域账册'],basis:'游戏原创设定（雪人、墨人等异人族群及跨域商贸为世界背景）',boundary:'两名八转蛊仙的争执、雪人潜入墨人城及账册纠纷均为原创场景，不是原著记载的本杰孙经历或异人大战。'},
   {id:'turning',name:'重大转折',plot:'盗天空门把玩家听闻的异象与本杰孙毕生追寻的目标联系起来，但商队传闻仍不是真实入口。升仙后，盗天空间、遁空蛊之败、疯魔窟·无极意志与落魄谷构成高风险历练：空间裂缝可能带来机缘，也可能让玩家付出代价；遁空蛊炼成不等于空门可入。',goal:'从凡人阶段的空门传闻推进到升仙后的空间历练，明确玩家所得与本杰孙原著结局的边界。',events:['盗天空门'],travelEvents:['盗天空间'],trialEvents:['遁空蛊之败','疯魔窟·无极意志','落魄谷'],basis:'原著明确内容（盗天追寻空门、遁空蛊与疯魔窟背景）＋游戏原创玩家历练',boundary:'玩家历练沿用既有触发门槛与结算；遁空蛊未能使本杰孙进入空门，不能把玩家的裂缝经历写成原著历史改写。'},
   {id:'ending',name:'时代终局',plot:'十道真传与归乡残页分别收束尊者传承门槛和玩家个人旅途。十道真传只对符合天外之魔条件者开放；归乡残页承接玩家此前对本杰孙旧闻的选择。随后仍由原有 dtFinale 与 tryEraZun 判断玩家是否争尊，并结算空穴、真传、杀招及个人结局。',goal:'让玩家决定如何面对偷道、归乡与传承，同时保留原有盗天终局与成尊条件。',events:['归乡残页'],trialEvents:['无间道'],route:"dtFinale() / tryEraZun('dt')",basis:'原著明确内容（盗天十道真传与天外之魔继承门槛）＋游戏原创玩家结局',boundary:'保留 dtFinale、tryEraZun 的原有条件、奖励与结算；不改变十道真传的天外之魔门槛，也不让玩家结局替代本杰孙未能进入空门的原著结果。'},
   {id:'legacy',name:'历史遗产',plot:'本杰孙旧闻、长毛炼场与时代余烬·盗天记录后人如何理解这位异乡来客。原著锚点是本杰孙为天外之魔、开创偷道、追寻归乡并与长毛老祖合作炼蛊；说书版本、毛民炼场、商旅衰败与玩家听闻均为原创侧写。',goal:'区分本杰孙的原著经历、后世传闻与玩家原创见闻，决定如何保存这段异乡故事。',events:['十道真传','本杰孙旧闻','长毛炼场','时代余烬·盗天'],basis:'原著明确内容（本杰孙天外之魔身份、偷道开创、与长毛老祖合作炼蛊）＋游戏原创历史回响',boundary:'长毛炼场与商旅传闻不是原著明确历史地点；不把盗天遗梦当作真实记忆传承，也不把遁空蛊残图当作配方。'}
  ],

 7:{
  eraIdx:7,eraName:'巨阳仙尊时期',releaseVersion:'v1.89',status:'已完成第一轮重构',
  historicalAnchor:'中古时代；巨阳仙尊以运道成尊并开创运道，留下运道真传、黄金血脉后裔、王庭福地与八十八角真阳楼；王庭之争与十年一度的北原风雪、王庭福地开启构成北原的重要历史传统。八十八角真阳楼由巨阳仙尊建立，长毛老祖参与炼制并将其提升至八转。长生天是巨阳仙尊的仙窍洞天，巨阳死后仍成为北原黄金血脉的祖庭与底蕴。',
  playerPosition:'玩家是中古时代北原的普通蛊师、部族成员、商旅或王庭外围参与者，在风雪、猎场、婚盟、运道市集与族谱争端中求生；不是巨阳仙尊本人，不因血脉印记自动成为黄金家族核心，也不是王庭福地或八十八角真阳楼的设计者。',
  characterBoundaries:['巨阳仙尊开创运道、留下后裔与运道真传，并建立王庭福地和八十八角真阳楼，作为原著历史锚点；不安排玩家必然与巨阳本人相遇。','巨阳死后遗留的意志与巨阳本人分开；王庭福地、八十八角真阳楼中的意志不等同复活后的巨阳本人。','长毛老祖在中古时代与盗天、巨阳均有炼蛊交集；其本人参与八十八角真阳楼炼制并将其提升至八转，不得与后世琅琊地灵混同。','黄金血脉是巨阳后裔的血脉传承，不等于血道修为；血祭夜、血脉印记及玩家获得的相关标记均为游戏原创，不代表巨阳原著祭典或血道传承。','巨阳的运道真传、王庭福地与八十八角真阳楼须分层呈现；普通玩家的运道心得、赌局与市井签文不等于获得三大运道真传。'],
  factionBoundaries:['北原部族、黄金血脉后裔、王庭之争与王庭福地属于巨阳历史影响下的时代背景；具体部族议事、婚盟、族谱与分肉均为游戏原创基层场景。','长生天在巨阳时期是其仙窍洞天居所；巨阳死后成为北原黄金血脉祖庭与底蕴。后世四荒仙人、八极子、劫运坛及方源第二世北原组织布局不得提前。','八十八角真阳楼由巨阳建立、长毛老祖参与炼制并提升至八转；不可写成巨阳独自完成全部炼制，也不可将王庭福地与长生天混为一处。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从北原风雪、部族营地与血祭夜进入巨阳之世。血祭夜是地方部族为祈求熬过寒季举行的原创仪式；玩家先面对祭品分配、族人戒备与风雪行路，再从血脉祠堂的旧谱中听见巨阳后裔的传闻。',goal:'建立玩家在北原基层部族中的身份，区分真实血脉传承与地方原创祭仪。',events:['血祭夜'],travelEvents:['血脉祠堂'],basis:'原著明确内容（巨阳后裔与北原黄金血脉背景）＋游戏原创基层仪式',boundary:'血祭仪式、祭文、血脉印记及祠堂内的具体族谱均为原创；血脉身份不等于血道修为，也不证明玩家属于巨阳直系。'},
   {id:'growth',name:'人物成长',plot:'运道小赌、运道签摊与北原赛马让玩家从市井赌局、签文和草原竞逐中体会运道的诱惑与风险。升仙后，运石市集与运道赌局继续检验玩家对运道资源的辨识；这些经历只能形成个人心得，不会自动取得巨阳真传。',goal:'让运道成长来自观察、判断与承担输赢，不把民间赌局包装成尊者真传。',events:['运道小赌','北原赛马','运道签摊'],travelEvents:['运石市集'],trialEvents:['运道赌局'],basis:'原著明确内容（巨阳开创运道并留下运道真传）＋游戏原创玩家经历',boundary:'签文、赛马与凡人赌局均为原创；运道气息和心得不是三大运道真传，也不代表掌握真实运道仙蛊。'},
   {id:'conflict',name:'时代矛盾',plot:'族谱记名与黄金血脉把名分、婚盟和资源继承推到台前；北原婚盟让年轻人的去留与部族生存发生冲突，牧场争界则让两支部族为冬季牧道和牲畜越界争执。王庭分肉承接玩家此前对巨阳王庭旧闻的选择，呈现普通族人如何在血脉名分之外争取一份口粮。',goal:'让玩家面对血脉名分、部族联姻与冬季资源分配的现实冲突，并承担选择后果。',events:['族谱记名','黄金血脉','北原婚盟','牧场争界','王庭分肉'],trialEvents:['血脉祭台','黄金族盟约'],basis:'原著明确内容（黄金血脉后裔与北原王庭体系背景）＋游戏原创基层冲突',boundary:'族谱登记、旁支继承争执、婚盟议事、牧场界碑与分肉规矩均为游戏原创推演；血脉不等于血道，不能把玩家盟约写成原著正式封爵制度。'},
   {id:'turning',name:'重大转折',plot:'弃子逃亡让玩家看见黄金血脉内部也有被排斥者；日蚀传言则把巨阳崇拜与运道异象混成一场未经证实的民间传闻。升仙后，真阳残柱与真阳遗影把玩家带到王庭福地和八十八角真阳楼的历史边缘，但残柱、幻影与玩家所得仍受既有门槛约束。',goal:'由基层血脉冲突推进到王庭福地与真阳楼相关的高风险探索，辨别遗产与附会。',events:['弃子逃亡','日蚀传言','雪原断道'],travelEvents:['真阳残柱'],trialEvents:['真阳遗影'],basis:'原著明确内容（王庭福地、八十八角真阳楼与巨阳遗产）＋游戏原创玩家遭遇',boundary:'日蚀、巨阳眨眼、血脉发热与雪原断道均为原创异闻；玩家见到的残柱/幻影不等于进入真阳楼核心，也不改变原著王庭福地历史。'},
   {id:'ending',name:'时代终局',plot:'巨阳王庭收束玩家对北原王庭旧制、黄金血脉与巨阳遗产的理解；北原王庭历练仍按原有门槛与结算推进。随后由既有 jyFinale 与 tryEraZun 判断玩家是否尝试成尊，并结算血脉、运道与个人道路的不同终局。',goal:'决定继承北原旧制、以运道自立或离开王庭体系，保留原有巨阳终局与成尊条件。',events:[],trialEvents:['北原王庭'],route:"jyFinale() / tryEraZun('jy')",basis:'原著明确内容（巨阳王庭、王庭福地与八十八角真阳楼）＋游戏原创玩家结局',boundary:'保留 jyFinale、tryEraZun 的原有条件、奖励与结算；玩家结局不改写巨阳仙尊开创运道、建立王庭福地及八十八角真阳楼的原著历史。'},
   {id:'legacy',name:'历史遗产',plot:'时代余烬·巨阳记录后人如何理解运道、黄金血脉与北原王庭。巨阳本人、死后意志、长生天洞天及后世黄金血脉组织必须分开；长毛老祖参与炼制八十八角真阳楼并提升至八转，是不可遗漏的合作边界。巨阳余晖历练则沿用原有触发条件，不把玩家的幻象遭遇当作巨阳本人现身。',goal:'辨认巨阳的原著历史、死后遗产与后世组织形态，决定如何保存自己的北原见闻。',events:['巨阳王庭','时代余烬·巨阳'],trialEvents:['巨阳余晖'],basis:'原著明确内容（巨阳开创运道、黄金血脉、王庭福地、八十八角真阳楼及长毛老祖参与炼制）＋游戏原创历史回响',boundary:'长生天的洞天阶段与后世组织活动分层；巨阳意志不等同巨阳本人；不将血祭、族谱、分肉或幻影称为原著明确仪式与事件。'}

 8:{
  eraIdx:8,eraName:'幽魂魔尊时期',releaseVersion:'v1.90',status:'已完成第一轮重构',
  historicalAnchor:'近古时代；幽魂魔尊以魂道成尊并开创魂道。其在世阶段以杀伐修魂；年轻时期与青家结下死仇并将其灭族，战场后来成为青鬼沙漠。幽魂死后，其本体残魂在生死门沉迷死境并派出十名分魂；其中七名越过逆流河，以赤橙黄绿青蓝紫之名在五域秘密建立影宗。',
  playerPosition:'玩家是近古时代普通蛊师、荒村行脚者、商路护卫或魂材市集中的小修行者，在荒村、白骨原野、元泉、商路与魂兽威胁之间求生；不是幽魂魔尊本人、青家幸存者、分魂或影宗成员。',
  characterBoundaries:['幽魂魔尊在世阶段与其死后残魂阶段必须分开；现有幽魂临世/关注度机制保留为玩家在其生前可能遭遇的高危分支，不代表每一则魂道异象都是幽魂本人现身。','幽魂死后，本体残魂在生死门沉迷死境并继续布局；此残魂不等同生前完整的幽魂魔尊，也不意味着凡人玩家能进入生死门或知晓其全部谋划。','原著中幽魂派出十名分魂，其中七名越过逆流河后创建影宗；影宗余烬与余烬密令只能作为身后/后世历史回响，不能写成幽魂在世时已公开活动的势力、真实据点或原著密令。','年轻时期的幽魂明幽灭青家，青家灭族后战场成为青鬼沙漠；青家遗藏、豆神宫与青仇的关联按后续揭示呈现，不得安排青家作为存续族群或出现仍以青家宗族延续的后人。'],
  factionBoundaries:['荒村、商队、魂材集市、采药者与临时避难点均为游戏原创基层场景；魂道、魂兽及魂材作为原著世界背景，不代表这些具体组织与交易曾被原著记载。','影宗是幽魂死后由七名分魂秘密建立的组织；幽魂在世时期不得提前出现影宗公开据点、完整组织体系或后世成员。','青家已经被幽魂灭族；青鬼沙漠、豆神宫遗藏与青仇形成的历史链条不能被改写为青家仍有完整族群、宗族议事或后代传承。','乐土仙尊在幽魂之后；不得提前引入乐土门人、镇魔悔哭海、后世影宗人物及方源时代的影宗复兴布局。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从空村拾遗与断桥夜渡进入幽魂之世。荒村留下的锅灶、蛊材与失散者痕迹只是普通人的灾后残局；断桥夜渡则让玩家在粮药运输与山洪险路之间作出选择。开局先建立基层求生处境，不把一地惨状指认为幽魂魔尊的某次屠戮。',goal:'建立玩家在近古时代荒村与商路中的普通身份，区分时代杀伐氛围与具体原创遭遇。',events:['空村拾遗','断桥夜渡'],travelEvents:['荒野寻蛊'],basis:'游戏原创设定（近古荒村、商路与野外蛊虫环境为背景）',boundary:'空村、山洪断桥、粮药商队与玩家救援均为原创；不指定为幽魂魔尊亲历或某次原著战场。'},
   {id:'growth',name:'人物成长',plot:'无主蛊群与荒地元泉让玩家在野外资源中求生，魂材易市则把魂兽残材、材料真伪与残留怨气带入市井。升仙后，魂道残卷与无主福地历练沿用既有门槛，玩家获得的只是自身修行机会，不会因为靠近幽魂时代就自动取得尊者真传。',goal:'让成长来自辨材、探索和谨慎取舍，避免把普通魂材误写成幽魂真传或高阶魂道秘法。',events:['无主蛊群','荒地灵泉','魂材易市'],travelEvents:['魂道残卷'],trialEvents:['无主福地'],basis:'原著明确内容（魂道、魂兽与元泉等世界体系）＋游戏原创玩家遭遇',boundary:'无主蛊群、荒地元泉、魂材集市与残卷均为玩家原创经历；不代表原著明确遗物、幽魂真传或固定修行地。'},
   {id:'conflict',name:'时代矛盾',plot:'白骨原野与魂兽过境让普通人面对战后尸骨、魂兽威胁与魂材诱惑。升仙后魂潮夜行把危险提升到魂流冲击，玩家可以潜行避开，也可以冒险劈开潮头；冲突始终是玩家自己的生存选择，不把尸骨原野写成幽魂某次明确战场。',goal:'呈现魂道盛行时代对基层生灵的压力，并让玩家在避险、救助与争夺资源之间承担后果。',events:['白骨原野','魂兽过境'],trialEvents:['魂潮夜行'],basis:'原著明确内容（魂道与魂兽背景）＋游戏原创荒村遭遇',boundary:'白骨遍野、魂兽经过荒村及玩家收集魂材均为原创；不据此推定幽魂魔尊亲自驱赶魂兽或在此地发动过原著战役。'},
   {id:'turning',name:'重大转折',plot:'灭门旧宅是与青家旧恨不同的原创灭门事件；玩家不能把每一座空宅都归因于幽魂。青家旧恨则回望年轻明幽与青家的真实冲突，并把青鬼沙漠、豆神宫遗藏与青仇的后续关联放在历史层面理解。升仙后白骨帝座、万魂谷与幽魂回望构成逐级加深的魂道试炼，其中幽魂回望可提高既有关注度，仍受原有风险机制约束。',goal:'辨认普通灭门惨案与幽魂灭青家的原著历史差别，并在魂道高危历练中承担既有代价。',events:['灭门旧宅','青家旧恨'],trialEvents:['白骨帝座','万魂谷','幽魂回望'],basis:'原著明确内容（年轻幽魂灭青家、青鬼沙漠与青仇关联）＋游戏原创玩家支线',boundary:'灭门旧宅为原创，不得与青家灭族混为一谈；青家已灭族，不能出现仍以青家名义延续的族人组织；历练中的帝影、幽影与目光按原有事件表现，不自动等同幽魂本尊现身。'},
   {id:'ending',name:'时代终局',plot:'幽魂之世的终局沿用原有万魂之夜、关注度、幽魂临世与个人结局分支；无主空城的夺宝历练也仍按既有结算进行。玩家可以在万魂之夜中求生、蛰伏或面对幽魂，但任何个人结局都不改变幽魂以魂道成尊、其后身死及残魂布局的原著历史。',goal:'决定玩家如何度过万魂之夜，并保留原有幽魂终局、关注度与成尊条件。',events:['余烬密令'],trialEvents:['空城夺宝'],route:"hunhunFinale() / tryEraZun('hy')",basis:'游戏原创玩家结局（以幽魂魔尊原著历史为背景）',boundary:'保留 hunhunFinale、hunhunShowdown 与 tryEraZun 的既有触发、奖励、战斗与结算；玩家不能以结局改写幽魂生死、青家灭族或影宗创建的历史。'},
   {id:'legacy',name:'历史遗产',plot:'魂灯夜话、幽魂魂碑与时代余烬·幽魂呈现凡人如何理解魂道与死亡；影宗余烬则只在幽魂死后，作为分魂创建影宗的后世回响出现。玩家听到的传闻、魂灯与碑刻都是原创侧写，不能被当作幽魂本尊遗物、生死门入口或影宗真实密令。',goal:'分清幽魂生前的尊者历史、死后的残魂布局与后世影宗活动，保存自己所见而不把传闻当作真相。',events:['魂灯夜话','幽魂魂碑','影宗余烬','时代余烬·幽魂'],trialEvents:[],basis:'原著明确内容（幽魂开创魂道、青家灭族、死后残魂与分魂创建影宗）＋游戏原创历史回响',boundary:'魂灯、姓名魂碑、废弃据点与旧令均为原创；影宗由幽魂死后七名分魂秘密建立，不能写成其生前公开势力或玩家可确认的原著遗物。'}
  ]

 9:{
  eraIdx:9,eraName:'乐土仙尊时期',releaseVersion:'v1.91',status:'已完成第一轮重构',
  historicalAnchor:'近古时代；乐土仙尊承接幽魂魔尊之后，以土道成尊。其以仁善、和平与德行感化世人，平息幽魂之后的杀戮与乱局，推动五域休养，并留下散布五域的真传。镇魔悔哭海位于蓝龙鲸洞天，是其重要布置之一。',
  playerPosition:'玩家是近古时代普通蛊师、灾后村落修行者、行脚人或地方守护者，在重建聚落、安葬亡者、调停争端与应对残余魂兽威胁中求生；不是乐土仙尊本人、亲传核心门人，也不因身处本时代自动获得五域真传。',
  characterBoundaries:['乐土仙尊本人是本时代尊者历史锚点；玩家经历的施粥、石窟、灯会、渡口与钟声均为原创场景，不安排玩家必然与乐土本人相遇。','乐土留下五域真传，门人及后继者可在不同地域承接；本期「乐土门人传法」只写不具名门人/传承者的原创讲述，不擅自指定为原著某位弟子。','陆畏因属于更后世承接南疆乐土真传的人物，不得提前成为乐土时期同行者、传法者或玩家熟识；不得把其后世经历倒置成本时代现场。','镇魔悔哭海位于蓝龙鲸洞天，相关封魔与悔悟布置不能泛化成普通海域普遍存在的异象；「悔哭海传闻」仍只是凡人转述，不代表玩家进入洞天。'],
  factionBoundaries:['乐土以仁善与德行感化世人、平息幽魂之后乱局有原著依据；具体净土、施粥棚、行脚僧、钟楼、渡口、灾后村落与地方规约均为游戏原创，不冒充乐土亲设的原著地点或制度。','五域真传是乐土留下的传承布局；门人传承活动与乐土本人在世时的行动分层，不把所有讲法者都认定为乐土亲传。','乐土时期的魂道影响逐渐受到抑制，但魂道传承、魂兽与既有魂道修行者并未因此全部消失；不把本时期写成魂道被彻底清除。','蓝龙鲸洞天与镇魔悔哭海按原著地点关系呈现；凡人海边听闻、海鸟预警与普通海域风浪均为原创，不得与悔哭海本体混同。'],
  acts:[
   {id:'opening',name:'时代开局',plot:'玩家从净土施粥与灾田复耕进入乐土之世。幽魂时代的杀戮与魂道灾祸留下许多破败聚落，但眼前的饥民、塌渠与荒田都需要普通人一点点收拾。玩家先决定如何救急、如何让幸存者重新生活，而不是一开始就接触尊者真传。',goal:'建立幽魂之后五域休养的基层视角，让仁善理念落实为眼前可执行的救助与重建。',events:['净土施粥','灾田复耕'],basis:'原著明确内容（乐土在幽魂之后平息乱局、推动五域休养）＋游戏原创灾后村落场景',boundary:'施粥棚、荒田、水渠与村民争议均为原创，不是乐土仙尊本人亲设的净土或原著记载的具体救灾事件。'},
   {id:'growth',name:'人物成长',plot:'厚土石窟与渡口问心让玩家从土道承载、安顿众生的角度审视修行；乐土行愿则把仁善理念化为普通人能理解的行动准则。升仙后可走访净土边，继续以土道与人道历练检验自身，而不是把听闻行愿文当成得到乐土完整真传。',goal:'以土道为主轴、兼顾人道与道心，令成长来自承担、辨识和持续实践。',events:['厚土石窟','渡口问心','乐土行愿'],travelEvents:['净土边'],basis:'原著明确内容（乐土以土道成尊、仁善理念影响五域）＋游戏原创寓言场景',boundary:'石窟、渡口与行愿文为原创；不把它们说成乐土本人修行地、亲笔遗训或真传入口。'},

function dispatchEraAllowedAt(table,name,eraIdx){
 var e,k;name=String(name||'');if(!name)return true;
 e=table[name];
 if(e&&e.eras&&e.eras.indexOf(eraIdx)<0)return false;
 if(e&&e.minEra!=null&&eraIdx<e.minEra)return false;
 if(e&&e.maxEra!=null&&eraIdx>e.maxEra)return false;
 for(k in table){if(Object.prototype.hasOwnProperty.call(table,k)&&k!==name&&name.indexOf(k)>=0){
  e=table[k];if(e.eras&&e.eras.indexOf(eraIdx)<0)return false;
  if(e.minEra!=null&&eraIdx<e.minEra)return false;if(e.maxEra!=null&&eraIdx>e.maxEra)return false;
 }}
 return true;
}

function auditWheelSystem(){
 var out={ok:true,version:APP_VER,notes:[],mismatches:[],zeroWeight:[],invalidWeight:[],unpickableVisible:[],sampleIntentional:[],engine:{}};
 try{
  out.engine.weightedPickIndex=typeof weightedPickIndex==='function';

  out.engine.rerollPick=typeof rerollPick==='function';
  out.engine.optW=typeof optW==='function';
  out.engine.rollW=typeof rollW==='function';
  /* 已知刻意 d≠w：显示有占比但实际不可抽（或加权不同） */
  out.sampleIntentional=[
   {label:'完整传承·盗天真传',d:55,w:100,note:'显示占比与实际权重分离'},
   {label:'残缺传承·拾遗',d:30,w:0,note:'可见但不可抽'},
   {label:'一无所获',d:15,w:0,note:'可见但不可抽'}
  ];
  out.notes.push('d 用于扇区显示角度，w 用于 weightedPickIndex；归一化时按 d 总和缩放，相对 w 比例保持。');
  out.notes.push('weightedPickIndex：非正数按 0；仅当整盘无正权重时退化均分。');
  out.notes.push('指定落点(RIG)与重抽互斥：rigged 后跳过重抽循环。');
  out.notes.push('命运盘(_FATE_KW)指定消耗 2 次蝉力，残蝉/完蝉有失败回落随机。');
  out.notes.push('animSpin 保留 rAF 400ms 卡死兜底，不得删除。');
  /* 运行期轻量自检：构造一盘含 0 权重，确认不会被抽中（多次采样） */
  if(typeof weightedPickIndex==='function'){
   var hits={A:0,B:0,C:0},i,ix,ws;
   for(i=0;i<200;i++){
    ws=[50,0,50];
    ix=weightedPickIndex(ws.slice());
    if(ix===0)hits.A++;else if(ix===1)hits.B++;else hits.C++;
   }
   out.zeroWeightProbe={hits:hits,ok:hits.B===0};
   if(hits.B!==0){out.ok=false;out.zeroWeight.push({probe:'A=50,B=0,C=50',hits:hits,issue:'零权重扇区被抽中'});}
   /* 全 0 应均分 */
   var uni={0:0,1:0,2:0};
   for(i=0;i<300;i++){
    ws=[0,0,0];
    ix=weightedPickIndex(ws.slice());
    uni[ix]=(uni[ix]||0)+1;
   }
   out.allZeroProbe={hits:uni,ok:true};
   /* 非法值 */
   var badHits=0;
   for(i=0;i<100;i++){
    ws=[10,NaN,-3,Infinity,'x',20];
    ix=weightedPickIndex(ws.slice());
    if(ix===1||ix===2||ix===3||ix===4)badHits++;
   }
   out.invalidProbe={badHits:badHits,ok:badHits===0};
   if(badHits){out.ok=false;out.invalidWeight.push({issue:'非法权重扇区被抽中',badHits:badHits});}
  }else{
   out.ok=false;out.notes.push('weightedPickIndex 不可用');
  }
  out.summary={
   intentionalDwMismatch:out.sampleIntentional.length,
   zeroWeightStrict:out.zeroWeightProbe?out.zeroWeightProbe.ok:false,
   invalidWeightStrict:out.invalidProbe?out.invalidProbe.ok:false,
   enginesPresent:out.engine
  };
 }catch(e){
  out.ok=false;out.error=String(e&&e.message?e.message:e);
 }
 return out;
}

function eraAllowed(entry){
  if(!entry) return true;
  /* eras 用于复活尊者/残念/真传等跨时代但非连续出场，避免 minEra~maxEra 误放行中间时代 */
  if(entry.eras && entry.eras.indexOf(S.eraIdx)<0) return false;
  if(entry.minEra!=null && S.eraIdx < entry.minEra) return false;
  if(entry.maxEra!=null && S.eraIdx > entry.maxEra) return false;
  return true;
}
function charEraAllowed(name){
  var e = CHARACTER_ERA[name],k;
  if(e)return eraAllowed(e);
  /* 事件标题常把人物名与剧情名连写；按完整登记名匹配，避免复合事件绕过人物时代门控。 */
  name=String(name||'');
  for(k in CHARACTER_ERA){
    if(Object.prototype.hasOwnProperty.call(CHARACTER_ERA,k)&&name.indexOf(k)>=0&&!eraAllowed(CHARACTER_ERA[k]))return false;
  }
  return true;
}

}

function eventEraAllowedAt(name,eraIdx){
  var e,k;
  name=String(name||'');
  if(!name)return true;
  e=EVENT_ERA[name];
  if(e){
    if(e.eras&&e.eras.indexOf(eraIdx)<0)return false;
    if(e.minEra!=null&&eraIdx<e.minEra)return false;
    if(e.maxEra!=null&&eraIdx>e.maxEra)return false;
  }
  for(k in EVENT_ERA){
    if(Object.prototype.hasOwnProperty.call(EVENT_ERA,k)&&k!==name&&name.indexOf(k)>=0){
      e=EVENT_ERA[k];
      if(e.eras&&e.eras.indexOf(eraIdx)<0)return false;
      if(e.minEra!=null&&eraIdx<e.minEra)return false;
      if(e.maxEra!=null&&eraIdx>e.maxEra)return false;
    }
  }
  return true;
}

}

function legacySourceEraAllowedAt(name,eraIdx){

    var min=e.eras[0],i;for(i=1;i<e.eras.length;i++)if(e.eras[i]<min)min=e.eras[i];

 var c=hex.length===4?('#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]):hex;
 var r=parseInt(c.substr(1,2),16),g2=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);
 if(!isFinite(r)||!isFinite(g2)||!isFinite(b))return '#FFFFFF';

}

function moveBase(m){

    凡道杀招基础值取「公式值」与「普攻底线（锚定÷2）」中的较大者——

    「低于普攻」的取值，公式值已达标的取值一概不变（对其他场景零影响）。 */
 if(m.t==='fan'){var wb=(m.school==='宙道'?(S.flags.wjIce||0):0);return Math.max(Math.round(20+S.deduc*10+anchor()/10),Math.round(anchor()/2))+wb;}
 if(m.t==='xian')return Math.round(60+S.deducX*20+anchor()/8)+(m.school==='宙道'?(S.flags.wjIce||0):0);
 if(m.t==='spec')return Math.round(100+S.deducX*20+anchor()/8)+(m.school==='宙道'?(S.flags.wjIce||0):0);
 if(m.t==='wu')return m.wu;

function addMove(m){
 /* v1.2.5 修复（容量回收）：原为单次 if——在「普攻被弃 → 战前 unshift 补回 → 再获新招」的交错下，
    数组可能停在 9 项并在弃掉普攻后留下 9 个非普攻杀招（超限）。while 版保证每次加招后总数 ≤8。 */
 while(S.moves.length>=8){
  var pri={fan:0,basic:1,xian:2,spec:3,wu:4},wi=0,low=1e9;
  S.moves.forEach(function(x,i){var v=moveBase(x)+ (pri[x.t]||0)*1000;if(v<low){low=v;wi=i;}});
  log('杀招满八式，忍痛舍弃【'+S.moves[wi].name+'】','sys');
  S.moves.splice(wi,1);
 }
 S.moves.push(m);
}

  var nm=name;

 });

async function maybeRandEvent(phase){
 try{
  if(typeof S==='undefined'||!S||!S.flags)return false;
  if(S.flags._randLock)return false;
  if(S.life!=null&&S.life<=0)return false;
  if(!R(randEventChance(phase)))return false;
  S.flags.randUsed=S.flags.randUsed||{};
  var post=phase!=='mortal'; /* v1.6.1：升仙后不再出现凡人向奇遇，改抽仙道奇遇 */
  var pool=RAND_EVENTS.filter(function(ev){
   if(S.flags.randUsed[ev.id])return false;
   return post?!ev.mortalOnly:!ev.xianOnly;
  });
  if(!pool.length)return false;
  var randSecs=pool.map(function(item){return [item.n,1];});
  var randIdx=await W('随机奇遇·事件盘','符合当前阶段且本局尚未触发的奇遇；抽过即记入本局',randSecs,{small:true});
  var ev=pool[randIdx];
  if(!ev)return false;
  S.flags.randUsed[ev.id]=true;dexAdd('ev',ev.n); /* v1.4.17 事件图鉴·随机奇遇登记 */
  S.flags._randLock=true;
  await say('——旅途中，一桩意料之外的事撞上了你。','sys');
  await ev.f();
  S.flags._randLock=false;
  renderPanel();
  return true;
 }catch(e){
  try{S.flags._randLock=false;}catch(_){}
  if(e===END_SENTINEL||(e&&e.end))throw e; /* v1.35 P0：终局信号不可降级为普通奇遇失败 */
  try{console.error('[随机奇遇]',e);}catch(_){}
  return false;
 }
}

 {era:5,n:'木灵采种',basis:'游戏原创设定（以木道环境为背景）',desc:'山谷里一批灵植结出新种，采集时稍有不慎便会伤及母株。当地采药人请你帮忙判断成熟程度。',options:[['择熟采种',40],['辨认木性与药性',35],['保护母株不采',25]],outcomes:['你挑出成熟种子，既留下母株，也为后续培育保存了材料。','你辨认出种子的木性与药性，对木道相关资源有了更深认识。','你决定不采尚未成熟的种子，避免为眼前收获损伤整片灵植。']},
 {era:5,n:'木脉争水',basis:'游戏原创设定（木道资源与灵植生态为背景）',desc:'山谷灵泉水量骤减，几处灵圃都说自己的木脉先枯。守圃人拿出旧渠图，药农却指出上游有人私改水闸。你可以查渠、协调分水，或封存证据暂不介入。',options:[['沿旧渠查验水闸',40],['召集各圃重新分水',35],['封存证据暂不介入',25]],outcomes:['你查出水闸被人私自抬高，留下刻痕与水位记录，争端有了查证依据。','你让各灵圃按生长时段轮流取水，虽不能立刻恢复旧产量，却保住了大部分母株。','你没有贸然开闸，只封存图纸与证词，避免被卷入各方争斗。']},
 {era:5,n:'画料失窃',basis:'游戏原创设定（画道工坊与凡人营生场景）',desc:'画坊一批矿彩与底胶不翼而飞，学徒被指偷窃，真正经手账册的管事却迟迟不肯露面。你可以核对账目、替学徒作证，或先追回画料。',options:[['核对出入账目',40],['替学徒据理作证',35],['先追回遗失画料',25]],outcomes:['你从领料与封存记录中找出账目缺口，管事不得不承认自己挪用了画料。','你替学徒争取到当面对质的机会，虽然未能立刻洗清所有嫌疑，却避免了他被私下逐出画坊。','你循着包装残屑追回画料，工坊得以继续开工，失窃缘由仍待后续查明。']},
 {era:1,n:'星宿棋痕',basis:'原著明确内容（历史回响；场景为原创）',desc:'一座旧亭的石桌刻满棋痕。讲棋的老者提到星宿仙尊以智道布局、辅佐天庭的传说，却没人能复原最后几手。'},
 {era:1,n:'智道书院',basis:'合理推断',desc:'书院招收能背诵星象与推演口诀的学徒。先生说星宿仙尊留下的影响，不只在天庭高层，也在一代代智道传承之中。'},
 {era:1,n:'天庭旧册',basis:'游戏原创设定',desc:'抄录天庭旧册的书吏发现几页名录被虫蛀空了。空白处没有答案，只有不同年代留下的批注。'},
 {era:1,n:'星门传令',basis:'游戏原创设定',desc:'夜空出现异象，驿站急令各地检查星门与传讯蛊。百姓不知道天庭为何紧张，只担心商路因此中断。'},
 {era:2,n:'无极石壁',basis:'游戏原创设定（疯魔窟与无极求道背景为原著明确；石壁纹路及守壁人说法为原创）',desc:'疯魔窟外围的石壁出现难以解释的纹路。有人将它们与无极魔尊的求道痕迹联系起来，但没有人敢说自己读懂了。'},
 {era:2,n:'疯魔窟役工',basis:'游戏原创设定（无极营建疯魔窟为原著明确；役工招募与未封门道场为原创推演）',desc:'招工告示承诺高额报酬，条件却是不得询问洞窟深处的声音。老役工说，无极魔尊的传说让这里既是机缘地，也是吞人的凶地。'},
 {era:2,n:'九虚回响',basis:'游戏原创设定',desc:'夜里传来九种不同的回声，像有人在远处逐一敲击石门。守夜人争论那是风声还是某种道场禁制。'},
 {era:2,n:'道场封门',basis:'游戏原创设定',desc:'道场忽然封闭，外门弟子与役工都被赶下山。封门理由无人知晓，只留下几卷关于无极之道的残缺讲义。'},
 {era:3,n:'狂蛮兽图',basis:'原著明确内容（历史回响；场景为原创）',desc:'兽皮上绘着远古荒兽与部族迁徙路线。族中祭司说狂蛮魔尊崇尚变化与力量，后人便把他的传说画进了狩猎图腾。'},
 {era:3,n:'部族盟誓',basis:'合理推断',desc:'数个部族在水源旁立誓共猎，盟约却没有写明猎物如何分配。年轻人相信强者为尊，老人只想让盟约撑过寒季。'},
 {era:3,n:'异人猎场',basis:'游戏原创设定',desc:'猎场边缘发现异人留下的工具与足迹。部族首领命人追踪，猎队却担心这会引来更强大的对手。'},
 {era:3,n:'变化道遗骨',basis:'游戏原创设定',desc:'山洞里留着一具形态扭曲的荒兽遗骨，骨面有变化道痕迹。它究竟是修行失败，还是某场古老战斗的遗留，无人能断定。'},
 {era:3,n:'迁徙踏痕',basis:'游戏原创设定（北原荒原与部族迁徙为时代环境；路线追踪与玩家护送为原创）',desc:'寒季将至，部族准备迁往新的水源地。旧路上兽迹与人迹交错，年轻猎手主张抄近道，老人却担心队伍会被兽群截断。你可以协助辨认足迹、护送老弱，或避开这场迁徙。',options:[['辨认兽迹，标出安全路线',40],['护送老弱先行',35],['不卷入迁徙，独自绕行',25]],outcomes:['你分清几处新旧兽迹，替队伍标出一条较稳妥的路线。','你陪着老弱走过最险的一段，队伍虽慢，却没有人在途中掉队。','你没有加入迁徙队伍，绕开了人兽混杂的旧路。']},
 {era:3,n:'兽骨分帐',basis:'游戏原创设定（部族狩猎与荒兽资源为原著世界背景；分配争执为原创）',desc:'猎队拖回一头荒兽，兽骨与兽肉却不足以让所有人满意。伤员认为自己应先得一份，年轻猎手则坚持按出力多少分配，争执眼看要演变成械斗。',options:[['核对猎获与伤员名册，重新分配',40],['替伤员争取一份',35],['记下争端，暂不站队',25]],outcomes:['你核对猎获与伤员名册，提出一套能让大多数人接受的分配办法。','你替伤员争取到应得的一份，也因此得罪了几名年轻猎手。','你没有当场站队，只把争端与各方说法记了下来。']},
 {era:4,n:'更漏校时',basis:'游戏原创设定（宙道为原著流派背景；漏刻检修与城镇计时争议为原创）',desc:'城中更漏近日频频失准，商铺开市、药铺煎药与守城换班都受了影响。漏刻匠认为是漏斗磨损，街坊却怀疑有人动过刻度。你可以查验器具、比对日影，或请匠人先恢复旧制。',options:[['拆检漏斗与刻度',40],['比对日影和旧历记录',35],['请匠人先恢复旧制',25]],outcomes:['你发现漏斗边缘有细小裂口，失准并非什么光阴异变。','你比对日影与旧历，找出误差来自几次仓促改刻。','你没有追究争执，只让匠人先修好更漏，城中作息逐渐恢复。']},
 {era:4,n:'河灯寄名',basis:'游戏原创设定（借红莲时代的宿命与遗憾主题；河灯仪式与人物故事均为原创）',desc:'河岸举行一年一度的寄名灯会。有人为远行者留灯，有人为逝者写名，也有人要求删去一名背约离乡之人的名字。主持者请你帮忙核对灯册，决定哪些名字应当留下。',options:[['逐一核对姓名与来历',40],['替逝者和远行者都留一盏灯',35],['不替他人决定，交还灯册',25]],outcomes:['你核对了姓名与来历，删去冒名之字，也替几名无人记得的旧人补上姓名。','你没有区分逝者与远行者，为他们都留下一盏灯。','你把灯册交还主持者，名字去留由当事人自行决定。']},
 {era:4,n:'红莲残瓣',basis:'原著明确内容（历史回响；场景为原创）',desc:'河滩上漂来一片不腐的红莲花瓣。说书人将它与红莲魔尊、光阴长河和宿命抗争联系起来，听众却各有理解。'},
 {era:4,n:'光阴渡口',basis:'合理推断',desc:'渡口近日常有旅人声称看见昨日的自己。摆渡人不问缘由，只要求每个人上船前说出一个绝不愿遗忘的名字。'},
 {era:4,n:'宿命旧说',basis:'原著明确内容（历史回响；场景为原创）',desc:'村中祭师讲述宿命蛊与红莲魔尊的故事。有人认为命数不可违，有人则相信红莲留下的反抗意志仍在影响世间。'},
 {era:4,n:'红莲棋局',basis:'游戏原创设定',desc:'商贩兜售一张标着逆流河的旧地图，声称沿河而上便能找回失去之物。地图上的水道却与任何已知地形都对不上。'},
 {era:5,n:'元莲画意',basis:'原著明确内容（历史回响；场景为原创）',desc:'画师临摹一幅青莲山水，画中木石似有生机。师傅说元莲仙尊开创木道、画道的传承，至今仍影响着中洲匠人与蛊师。'},
 {era:5,n:'画坊修卷',basis:'游戏原创设定（以元莲留下画道布置的原著背景为参照）',desc:'一处中洲旧画坊受潮，几卷画稿的颜料开始剥落。画工请你帮忙辨认底稿、调配矿彩，或先封存残卷。这些只是地方画坊的旧稿，并非元莲仙尊亲笔。',options:[['辨认底稿层次',40],['调配矿彩修补',35],['封存残卷待考',25]],outcomes:['你辨清底稿与后添笔迹，留下了可供后人核对的修复记录。','你调好矿彩，补住几处剥落，却没有擅自续画原作者的笔意。','你将残卷妥善封存，避免一时修补毁去原有痕迹。']},
 {era:5,n:'天元宝莲',basis:'原著明确内容（历史回响；场景为原创）',desc:'药铺展示一株号称能结出元石的宝莲仿品。掌柜提起元莲仙尊创出的天元宝莲一系：三转天元宝莲产出元石，晋升至六转天元宝皇莲后才产出仙元；眼前仿品并无可靠凭证。'},
 {era:5,n:'豆神宫旧闻',basis:'原著明确内容（历史回响；场景为原创）',desc:'游历者谈起豆神宫与元莲仙尊的布局。故事传到凡人耳中，只剩下木豆、画壁与一座会吞没来客的古老宫殿。'},
 {era:6,n:'盗天空门',basis:'原著明确内容（历史回响；场景为原创）',desc:'西漠商队传出空门传闻。有人说盗天魔尊本杰孙毕生寻求归乡之路，空门正是他留下的执念与谜题。'},
 {era:6,n:'本杰孙旧闻',basis:'原著明确内容（历史回响；场景为原创）',desc:'说书人讲到一位来自异域的天外之魔：他创偷道、求归乡，也曾与长毛老祖合作炼蛊。听众最记得的，却是他未能抵达的故乡。'},
 {era:6,n:'遁空蛊残图',basis:'原著明确内容（历史回响；场景为原创）',desc:'残图记载着遁空蛊的炼制思路，旁边注明曾有长毛老祖与盗天魔尊合作的旧事。图纸缺页严重，无法据此复原仙蛊。'},
 {era:6,n:'长毛炼场',basis:'原著明确内容（历史回响；场景为原创）',desc:'毛民炼场里流传着长毛老祖的故事。老人说中古炼道盛极一时，盗天与巨阳两位尊者都曾与这位炼道大宗师有过交集。'},
 {era:6,n:'驼铃夜宿',basis:'游戏原创设定（西漠商旅与荒漠行路为时代环境；商队夜宿与玩家协助为原创）',desc:'一支西漠商队在风沙前寻到背风处扎营，驼兽却因饮水分配不均躁动起来。领队担心夜里走散，伙计们则互相指责有人私留水囊。你可以清点水袋、协助安抚驼兽，或不介入商队内务。',options:[['清点水袋与行程记录',40],['协助安抚驼兽并调配饮水',35],['不介入，守住自己的行囊',25]],outcomes:['你核对水袋封口与行程记录，找出一只漏水的旧囊，商队不再互相猜疑。','你帮忙安抚驼兽并重新安排饮水，商队虽耽搁了行程，却平安度过风沙夜。','你没有卷入商队内部争执，只守好自己的行囊，天亮后独自上路。']},
 {era:6,n:'异域账册',basis:'游戏原创设定（跨地域商贸与异乡见闻为时代背景；账册核对为原创）',desc:'货栈掌柜拿来两本互相矛盾的账册：一份记着异域蛊材的进货数，另一份却少了几笔转运记录。伙计怀疑有人私吞货物，掌柜只想尽快结账。你可以核对账目、询问搬运工，或只抄录差异后离开。',options:[['逐笔核对货物与账目',40],['询问搬运工与经手人',35],['抄录差异，不替任何一方定罪',25]],outcomes:['你按货箱编号逐笔核对，发现差额来自一次重复登记，账目终于对上。','你询问搬运工与经手人，查明有一批货临时改道，并非有人私吞。','你只抄下两份账册的差异，没有仓促定罪；这份记录或许能在日后派上用场。']},
 {era:7,n:'巨阳王庭',basis:'原著明确内容（历史回响；场景为原创）',desc:'北原各部谈起王庭福地与巨阳仙尊留下的血脉、运道影响。对普通族人而言，传说最终落在名分、婚盟与资源分配上。'},
 {era:7,n:'黄金血脉',basis:'合理推断',desc:'族中长老重新核对黄金血脉族谱，几支旁系为继承顺序争执不休。巨阳仙尊的遗泽被视作荣耀，也成为现实中的权力凭据。'},
 {era:7,n:'运道签摊',basis:'游戏原创设定',desc:'集市里有人摆出运道签摊，声称能测出下一场风雪与猎获。签文看似灵验，摊主却从不肯解释其中的蛊虫手段。'},
 {era:7,n:'北原婚盟',basis:'合理推断（北原部族联盟与黄金家族势力关系有原著背景；具体联姻议事为原创）',desc:'两个部族为抵御寒潮商议联姻。年轻人不愿成为盟约筹码，族老则认为在北原，活过冬天比个人心愿更重要。'},
 {era:7,n:'雪原断道',basis:'游戏原创设定（北原风雪与部族迁徙为时代环境；本次商路受阻为原创）',desc:'一场骤雪封住两处营地之间的旧道，运粮队迟迟未归。斥候争论应否穿过风口，营地里的老人和伤员却已等不起。你可以查探背风路线、带人接应，或留下路标等待风雪稍歇。',options:[['查探背风路线与雪层',40],['带人接应运粮队',35],['留下路标，等待风雪稍歇',25]],outcomes:['你沿山脊辨出一条背风路线，运粮队得以绕过最深的雪沟。','你带人赶到半途接应，虽然耽误了回程，却把粮袋与伤员一并带回营地。','你没有冒险穿越风口，只留下醒目的路标，避免更多人迷失在风雪中。']},
 {era:7,n:'牧场争界',basis:'游戏原创设定（北原部族与牲畜牧养为时代环境；牧道界碑争端为原创）',desc:'两支部族都称一片背风草场属于自家旧牧地。界碑被积雪推倒，牛羊已经越过旧界，年轻牧人拔刀相向，族老则担心争斗会拖垮整个冬季。你可以查验旧界、协商轮牧，或记录双方证词暂不站队。',options:[['清理界碑并核对旧记',40],['协商分时轮牧',35],['记录证词，不替双方定界',25]],outcomes:['你清出被雪掩埋的界碑残基，并找到旧牧道记录，双方至少有了重新议界的依据。','你促成两支部族分时轮牧，眼前争斗暂时平息，牲畜也有了过冬草场。','你没有贸然替任何一方裁决，只记录双方证词与牲畜越界情况，留下日后查证的凭据。']},
 {era:8,n:'断桥夜渡',basis:'游戏原创设定（近古时代的荒村与商路环境；桥梁损毁及护送为原创）',desc:'山洪冲断了通往荒村的木桥，一队运送粮食与药材的行商被困在河岸。天色渐暗，村中病者等着药材，商队却不敢拿所有人的性命冒险。你可以检查旧缆、组织分批搬运，或留下记号等待水势回落。',options:[['检查旧缆与桥墩',40],['组织分批转运粮药',35],['留下记号，等水势回落',25]],outcomes:['你发现主缆并未完全断裂，补上临时绳索后，商队得以谨慎通过。','你组织众人分批运送粮药，虽然耗时，却让药材赶在夜深前送到村中。','你没有冒险渡河，只留下清晰记号与避险路线，避免有人在黑暗中误入急流。']},

/* v1.80：支线前置选择属于互斥状态；多个旧标记并存时不得按数组顺序擅自替玩家选边。 */
function eraLinkChoiceState(link,marks){
 var opts=['细查来历','出手相助','收存线索'],found=[],i,mark;
 marks=marks||[];
 if(!link||!link.from)return {choice:'',conflict:false,choices:found};
 for(i=0;i<opts.length;i++){
  mark='支线选择·'+link.from+'·'+opts[i];
  if(marks.indexOf(mark)>=0)found.push(opts[i]);
 }
 return {choice:found.length===1?found[0]:'',conflict:found.length>1,choices:found};
}
function eraLinkChoice(link){
 var state=eraLinkChoiceState(link,S&&S.marks?S.marks:[]);
 return state.conflict?'':state.choice;
}
function eraLinkReady(name){
 var i,link,c;
 for(i=0;i<ERA_MORTAL_LINKS.length;i++){
  link=ERA_MORTAL_LINKS[i];
  if(link.n!==name)continue;
  c=eraLinkChoice(link);
  return !!c&&!hasMark('已见·'+link.n)&&S.eraIdx===link.era;
 }
 return false;
}
/* 前置事件在本轮事件池建立后才完成时，将刚解锁的后续节点加入剩余抽取池。 */
function unlockEraMortalLinks(pool){
 if(!pool||!S)return;
 ERA_MORTAL_LINKS.forEach(function(link){
  if(link.era===S.eraIdx&&(!pool._kind||mortalEventKind(link.n)===pool._kind)&&eraLinkReady(link.n)&&!pool.some(function(x){return x.n===link.n;}))pool.push({n:link.n,w:8});
 });
 if(S.eraIdx===0&&(!pool._kind||pool._kind==='era')&&hasMark('气脉夜袭线索')&&!hasMark('气脉支线结案')&&!hasMark('已见·气脉夜袭')&&!pool.some(function(x){return x.n==='气脉夜袭';}))pool.push({n:'气脉夜袭',w:6});
}
/* v1.82 试改：时代事件次数盘结束后，未完成的元始气脉支线仍保留为待抽节点。
   续抽只从已解锁的支线节点中用 W() 抽取，不直接执行剧情；每个节点最多一次。 */
async function drawPendingMortalEraLinks(yearCost){
 var round=0,pending=[],i,link,secs,idx,name;
 if(!S||S.eraIdx!==0)return 0;
 while(round<2){
  pending=[];
  for(i=0;i<ERA_MORTAL_LINKS.length;i++){
   link=ERA_MORTAL_LINKS[i];
   if(link.era===0&&eraLinkReady(link.n)&&!hasMark('已见·'+link.n))pending.push({n:link.n,w:8});
  }
  if(hasMark('气脉夜袭线索')&&!hasMark('气脉支线结案')&&!hasMark('已见·气脉夜袭'))pending.push({n:'气脉夜袭',w:6});
  if(!pending.length)break;
  if(S.life<=0)await ending('寿元尽消','寿数如烛，燃尽在气脉旧事的余波中。');
  secs=pending.map(function(x){return [x.n,x.w];});
  idx=await W('支线余波·事件盘','已解锁的未完支线；仍需转盘抽取 · 每次耗'+yearCost+'年寿元',secs,{small:true});
  name=pending[idx].n;
  spendLife(yearCost);
  await genericEvent(name);
  await eventWorldAside(name);
  await injuryTick();
  renderPanel();
  round++;
 }
 return round;
}
async function eraMortalLinkDispatch(name){
 var i,link,choice,c,ending;
 for(i=0;i<ERA_MORTAL_LINKS.length;i++)if(ERA_MORTAL_LINKS[i].n===name){link=ERA_MORTAL_LINKS[i];break;}
 if(!link||link.era!==S.eraIdx||hasMark('已见·'+name))return false;
 choice=eraLinkChoice(link);
 if(!choice)return false;

/* ── 11 EVENT · 关键历练 ─────────────────────────────────────────── */
function myPower(){return anchor()+realmBonus()+30;}
function lvOfAnchor(a){return a>=500?9:a>=250?8.5:a>=210?8.5:a>=200?8:a>=175?7.5:a>=150?7:a>=130?6.5:a>=100?6:a>=70?5.5:a>=60?5:a>=45?4:a>=35?3:a>=20?2:1;}
/* 战败盘权重：轻伤固定最高42、再战固定最低8、重伤24；死亡=5+8×转差^1.5 平滑上扬，
   转差≥3 时当场死亡强制100%。[PLACEHOLDER·Monte Carlo 验证路径：g10_run.js 看死亡率拐点] */
function defeatWeights(wLv,lLv,deathTop,dblDeath){
 var dblBoost=dblDeath?2:1; /* v1.2.5：重伤未愈——当场死亡概率提升 100%（权重翻倍） */
 if(deathTop)return [['再战',8],['轻伤撤退',42],['重伤逃跑',24],['当场死亡',45*dblBoost]];
 var d=Math.max(0,Math.floor(wLv)-Math.floor(lLv));
 if(d>=3)return null;
 var death=5+8*Math.pow(d,1.5);
 death*=((Math.floor(lLv)>=6)?2:1.5);
 return [['再战',8],['轻伤撤退',42],['重伤逃跑',24],['当场死亡',death*dblBoost]];
}
function defeatSecs(w,allowRetry,forPlayer){
 var col={'再战':'#1E8449','轻伤撤退':'#2471A3','重伤逃跑':'#D35400','当场死亡':'#C0392B'};
 var list=w||[['当场死亡',100]];
 if(!allowRetry)list=list.filter(function(x){return x[0]!=='再战';});
 return list.map(function(x){return [x[0],x[1],undefined,col[x[0]]];});
}
 async function playerDefeat(eT,label,allowRetry,deathName,saves,deathCut,opts){
 opts=opts||{};
 if(S.flags.tyTier===2&&!S.flags.tySaved){S.flags.tySaved=true;await say('【天意庇佑】——你本该死了，但天意把你从死亡线上拉了回来（钟爱档 · 全局一次）。','gold');return 'retry';} /* v1.5.0 */
 if(S.flags.passiveSanqi){S.flags.passiveSanqi=false;await say('【被动仙道杀招·三气归来】发动——气绝复生，你再度站起！（全局仅一次）','gold');return 'retry';} /* v1.0.14 */
 if(typeof deathCut!=='number'||!isFinite(deathCut))deathCut=null; /* v1.0.8：防参数错位传入对象 */
 var w=defeatWeights(lvOfAnchor(eT),S.lv,!!opts.deathTop,S.flags.injured>0);
 if(deathCut&&!opts.deathTop)w=w.map(function(x){return x[0]==='当场死亡'?[x[0],Math.round(x[1]*deathCut)]:x;});
 var secs=defeatSecs(w,allowRetry,true);
 secs=secs.filter(function(x){return isFinite(x[1])&&x[1]>0;}); /* v1.0.8：滤掉 NaN/0 权重，保证盘面可渲染 */
 if(!secs.length)secs=[['再战',100]];
 if(opts.noFlee)secs=secs.filter(function(x){return x[0]!=='轻伤撤退'&&x[0]!=='重伤逃跑';});
 await say(label+'——你落下风！战败盘落定去留。','bad');
 var idx=await W('战败盘',label+' · 败者听天由命',secs,{small:true,cls:'bad'});
 var name=secs[idx][0];
 if(name==='当场死亡'){
  if(saves){var tags=['nilu','sanqi','wuji','hunbao'];for(var si=0;si<tags.length;si++){if(await trySave(tags[si],saves))return 'saved';}}
  if(S.flags.ctrlOnce>0){S.flags.ctrlOnce--;S.pctMods-=0.15;await say('【超级蛊阵控制权】轰然发动——你从必死之局中被挪出阵外！','gold');return 'saved';}
  if(hasMark('红莲真意')&&!S.flags.hlUsed){S.flags.hlUsed=true;await say('红莲真意燃起——败势倒转，你脱出死地！','gold');return 'saved';}
  if(await tryBatchSave()){await say('【'+S.flags.batchSaveName+'】护体——你从死局中脱身！','gold');return 'saved';} /* v1.1.6【接线】批量保命类（无量气海/鬼官衣） */
  if(opts.fatalAsHurt){S.pctMods-=0.15;spendLife(5);await say('天地伟力压落——你被重伤吐出，捡回一条命（权重-15%、寿元-5年）。','bad');await applyInjury();return 'done';}

 var seen={},i,e,k,validAct;
 for(i=0;i<ERA_TIMELINE.length;i++)out.byEra.push({eraIdx:i,eraName:ERA_TIMELINE[i].name,count:0,reviewed:0});
 for(i=0;i<ERA_EVENT_CATALOG.length;i++){
  e=ERA_EVENT_CATALOG[i];
  if(!ERA_TIMELINE[e.eraIdx])out.invalidEra.push(e);
  else{
   out.byEra[e.eraIdx].count++;
   if(e.status==='已核对'&&e.actId){out.byEra[e.eraIdx].reviewed++;out.reviewed++;}
  }
  if(e.hasGate)out.gated++;
  if(!e.actId||e.status==='待审计')out.unassigned.push(e);
  validAct=false;
  for(k=0;k<ERA_ACT_TEMPLATE.length;k++)if(ERA_ACT_TEMPLATE[k].id===e.actId){validAct=true;break;}
  if(e.actId&&!validAct)out.invalidAct.push(e);
  if(e.kind){out.byKind[e.kind]=(out.byKind[e.kind]||0)+1;}
  if(e.basis&&e.basis!=='待核对'){out.byBasis[e.basis]=(out.byBasis[e.basis]||0)+1;}
  k=e.name;
  if(!seen[k])seen[k]=[];
  seen[k].push(e);
 }
 for(k in seen)if(Object.prototype.hasOwnProperty.call(seen,k)&&seen[k].length>1)out.duplicateNames.push({name:k,entries:seen[k]});
 if(out.invalidEra.length)out.errors.push('事件索引存在无效 eraIdx。');
 if(out.invalidAct.length)out.errors.push('事件索引存在无效六幕 actId。');
 if(out.unassigned.length)out.warnings.push('仍有 '+out.unassigned.length+' 条旧时代凡人事件待逐条核对；本轮已完成元始、星宿、无极、狂蛮、红莲、元莲、盗天、巨阳、幽魂、乐土、炼天十一期初审归档。');
 if(out.duplicateNames.length)out.warnings.push('发现 '+out.duplicateNames.length+' 个同名事件跨池/重复登记候选，需核对是否为有意复用。');
 out.ok=out.errors.length===0;
 return out;
}

 var selfOutcome=(opts.enemyOutcome==='onWin');

/* ══ 心剑关（v1.14.26） ══════════════════════════════════════════════
   独立实现，不复用 duel()：镜像用玩家自己的杀招打玩家，不落敌方杀招轮。
   三合两胜：每合抓一个玩家杀招作为"镜像招式"，判玩家是否截断。
   返回 true = 过关；false = 失败（杀招≥4 时丢掉第一个被"带走"的杀招，不足四式则改为永久扣该式权重）。
   ==================================================================== */
async function jianXinDuel(){
 var hits=0,forgot=[];

 /* 薄青真传线：镜像先亮薄青的招，压迫感拉满 */
 if(hasMark('薄青真传')&&S.moves.some(function(m){
   return ['五指拳心剑','五指全心剑','剑痕索命','一剑西来','无我剑意'].indexOf(m.name)>=0;
 })){
  await say('对方先笑了：「薄青那一套，我也会。」','battle');
 }

 for(var r=0;r<3;r++){
  /* 从玩家杀招池里抓一个还没被"记住"的 */
  var cand=S.moves.filter(function(m){return m.t!=='basic'&&forgot.indexOf(m.name)<0;});
  if(cand.length){
   var pickM=cand[Math.floor(RNG()*cand.length)];
   forgot.push(pickM.name);
   await say('「我记得这一式。」——对方使出了【'+pickM.name+'】。','bad');
  }else{
   await say('对方使出一式你叫不出名字的剑。','bad');
  }

  /* 每合判定：剑心阶位 + 剑道境界 + 基础 45 */
  var pr=Math.min(92,45+jianXin()*10+rlm('剑道')*4);
  if(await rollW(pr,'心剑关·第'+(r+1)+'合（'+pr+'%）')){
   hits++;
   await say('你以更快的剑截断了它。','good');
  }else{
   await say('这一合，你慢了。','bad');
  }
 }

 /* 两胜即过：被"记住"的招全部归还 */
 if(hits>=2){
  if(forgot.length)await say('被遗忘的招重新回到剑心：'+forgot.join('、')+'。','gold');
  return true;
 }

 /* 败：杀招充足时删除；不足四式则改扣该式权重，避免杀招盘崩坏 */
 if(forgot.length){
  var loss=forgot[0],nonBasic=0;
  S.moves.forEach(function(m){if(m.t!=='basic')nonBasic++;});
  if(nonBasic<4){
   var lm=null;
   for(var i=0;i<S.moves.length;i++){if(S.moves[i].name===loss){lm=S.moves[i];break;}}
   if(lm){
    lm.wPen=Math.min(0.6,(lm.wPen||0)+0.2);
    await say('【'+loss+'】没有被带走——杀招不足四式，剑心替你护住了它，但此式永久 -20% 权重（累计 -'+Math.round(lm.wPen*100)+'%）。','bad');
    log('心剑关败——杀招不足四式，改扣【'+loss+'】权重（累计 -'+Math.round(lm.wPen*100)+'%）。','bad');
   }
  }else{
   for(var i=0;i<S.moves.length;i++){
    if(S.moves[i].name===loss){S.moves.splice(i,1);break;}
   }
   await say('【'+loss+'】从此不在你的剑里。','bad');
   log('心剑关败——杀招【'+loss+'】被"没有剑的你"带走。','bad');
  }
 }
 return false;
}

/* ══ 薄青线《剑上旧影》（v1.14.26） ═════════════════════════════════════
   触发：持【薄青真传】后，游历/历练累计计数触发。三幕：问剑 → 试锋 → 斩情。
   两结局标记：薄青合剑（求道/空手）/ 薄青见剑（务实）。
   失败留在当前幕，下次再来。不杀不 ending。
   ======================================================================== */
function bqOn(){return hasMark('薄青真传')&&(S.flags.bqStage||0)<3;}

async function checkBoqingLine(){
 if(!bqOn())return false;
 if(S.flags._bqLock)return false;
 if(S.life<=0)return false;
 S.flags.bqCount=(S.flags.bqCount||0)+1;
 if(S.flags.bqCount<1)return false;
 S.flags.bqCount=0;
 S.flags._bqLock=true;
 try{
  var st=S.flags.bqStage||0;
  var stageName=st===0?'薄青·问剑':(st===1?'薄青·试锋':'薄青·斩情');
  var bqPick=await W('薄青剑影·事件盘','薄青真传持有者的阶段支线；本幕未完成时解锁',[[stageName,1]],{small:true});
  if(bqPick!==0)return false;
  await say('——剑，忽然自己响了。——','gold');
  if(st===0)await bqEnc1();
  else if(st===1)await bqEnc2();
  else if(st===2)await bqEnc3();
 }catch(e){
  if(e===END_SENTINEL||(e&&e.end))throw e; /* v1.35 P0：终局信号继续向上层传播 */
  try{console.error('[薄青线]',e);}catch(_){}
 }finally{
  S.flags._bqLock=false;
 }
 renderPanel();
 return true;
}

 var n=String(name||''),q=String(quote||'');

 if(/死|亡|败|殒|葬|困/.test(n))return '数年后，旧地换了主人。当地人偶尔提起此事，已说不清当事者的全名，只记得那段岁月曾有人走到这里。';
 if(/归|隐|退|别|离|终/.test(n))return '此后世事照常向前。有人记得离去的背影，有人只记得留下的空缺；时间没有替任何一方给出定论。';
 if(/方源|白凝冰|商心慈|古月|贾金生|乐土|元莲/.test(n+' '+q))return '多年以后，相关人物的名字仍偶尔出现在地方旧闻里。传言各有版本，唯有当日留下的痕迹，证明这段相逢并非虚言。';
 return '多年以后，此事被收入一卷不甚起眼的旧闻。亲历者各有说法，后世难复原当日全貌，只知道那一刻曾真实地改变过某些人的命数。';
}

    var seenDex=Object.create(null);
    for(var di=0;di<arr.length;di++){var item=arr[di];if(typeof item!=='string'||!item.trim()||item.length>200||seenDex[item])return false;seenDex[item]=1;}
   }
  }
  if(data.achv===undefined&&data.dex===undefined)return false;
  /* 完成全部校验后再写入，避免无效数据污染现有存档。 */
  if(data.achv!==undefined)localStorage.setItem('guAchv',JSON.stringify(data.achv));
  if(data.dex!==undefined)localStorage.setItem('guDex',JSON.stringify(data.dex));
  return true;
 }catch(e){return false;}
}

/* ══ 14.6 DEX · 结局动态兜底区（v1.33） ═══════════════════════════
   ending() 每次调用都会尝试 registerEnding(name, meta)。
   - 若 name 已在 END_META 声明 → 忽略（静态优先，不覆盖）。
   - 若已在 _endingDynamic → 忽略（幂等）。
   - 否则写入动态区，图鉴立即可见。
   仅存于内存，不落 localStorage —— 结局名表是「游戏内容」，不是「玩家存档」。 */
var _endingDynamic=Object.create(null); /* name -> {line, tier, hint} */
function registerEnding(name,meta){
 if(!name)return;
 var n=String(name);
 if(END_META[n])return; /* 静态已声明，不覆盖 */
 if(_endingDynamic[n])return; /* 已兜底，幂等 */
 _endingDynamic[n]={
  line:(meta&&meta.line)||'other',
  tier:(meta&&meta.tier!=null)?meta.tier:2,
  hint:(meta&&meta.hint)||'',
  epilogue:(meta&&meta.epilogue)||''
 };
}
function getEndMeta(id){
 if(END_META[id])return END_META[id];
 if(_endingDynamic[id])return _endingDynamic[id];
 return null;
}
function getAllEndingNames(){
 var base=DEX_ENDINGS.slice();
 var dyn=Object.keys(_endingDynamic);
 for(var i=0;i<dyn.length;i++){
  if(base.indexOf(dyn[i])<0)base.push(dyn[i]);
 }

/* ══ 12 ERA · 盗天魔尊期「无蛊之世」 ═══════════════════════════════════
   v1.3.1 · 盗天魔尊期「无蛊之世」
   ---------------------------------------------------------------------
   原作出处：
     ·「他擅长宇道，开创偷道」        ·「不用任何仙元，就能时刻有效」
     ·「无相手……不管是不是本命蛊，一律照夺不误」
     ·「抽取自身宇道道痕凝结出盗天空间，堵住缺口」
   机制：
     M1 万蛊失窃   每事件 完善度 −1（下限 0）
     M2 双弱       战斗末步双方权重 ×0.5（相对胜率不变，回合拉长）
     M3 无相手掠影 每 5 个事件一次；命中 → 完善度 −2 且留下「窃痕」10 事件
     M4 窃取度     满 100 → 空穴显露
     M5 道统红利   宇道/偷道 降低被窃概率
   ===================================================================== */
var DT_HOLE=60;   /* v1.3.1：实测盗天期约 10–16 个事件，阈值由 100 下调至 60 */
function dtOn(){return S.eraIdx===6;}
function dtTaint(){return S.flags.dtTaint||0;}
function dtStealVal(){return Math.min(100,dtBase()+(S.flags.dtSt||0));}
function dtBase(){
 var lv=S.lv,b=0;
 if(lv>=8.5)b=70;else if(lv>=8)b=40;else if(lv>=7)b=20;
 if(hasSchool('偷道'))b+=10;
 return Math.min(100,b);
}
function dtAdd(n){S.flags.dtSt=(S.flags.dtSt||0)+n;if(dtStealVal()>=DT_HOLE)S.flags.dtSt=DT_HOLE-dtBase();}

/* 完善度下降（与 wormUp 对称；WORM_N 下标越大越差） */
async function wormDown(n){
 for(var k=0;k<n;k++){
  if(S.wormIdx>=WORM_N.length-1){log('蛊虫完善度已至最低——再无可失。','bad');return;}
  S.wormIdx++;
  log('蛊虫完善度下降 → '+wormName()+'（万蛊失窃）','bad');
 }
}

async function dtRaid(){
 var p=45;
 if(hasSchool('宇道')||hasSchool('偷道'))p=15;   /* 藏空：两条道各降 30pp */
 if(!R(p/100)){
  dtAdd(8);
  await say('一只无相手从虚空里探了探，抓了个空。你顺势看清了它指节的走势。','gold');
  log('无相手抓空——你摸清了它的路数（窃取度上升）','good');
  return;
 }
 await say('一只无相手从虚空中探出——五指扣住你的蛊窍。','bad');
 await say('它没有杀你，只是把手一抽。','bad');
 await wormDown(2);

}

/* M1 + M3 事件级节拍 */
async function dtTick(){
 if(!dtOn())return;
 S.flags.dtEv=(S.flags.dtEv||0)+1;
 await wormDown(1);
 if(dtTaint()>0){
  S.flags.dtTaint--;
  if(S.flags.dtTaint%3===0&&S.flags.dtTaint>0)await wormDown(1);
  if(S.flags.dtTaint===0)await say('窃痕终于淡了。窍中重新听得见蛊虫的动静。','good');
 }

 await dtCheck();
}

 if(S.flags.dtWide&&hasMark('遁空蛊')&&hasMark('推杯换盏蛊')&&hasMark('盗天真传')){

  var hole=await optW('破洞当前',[['以宇道道痕去堵',35],['踏进破洞',30],['把破洞再撕大',20],['转身逃走',15]]);

   await say('你抽出自己的宇道道痕，去堵。','gold');

  if(hole===1)await ending('破洞行人','你走进去。后面的人说你失踪了。前面的风说：还有下一条缝。');

  await ending('逃离开裂','你跑了。裂缝在身后慢慢合上，像什么都没发生——只有你知道发生过。');
 }

 /* —— 空穴显露 / 高窃取度 —— */
 if(S.flags.dtHole||(hasMark('遁空蛊')&&dtStealVal()>=DT_HOLE)){
  await say('那道缝还在。有人说它是门，有人说它是伤。','sys');

  if(hx===0)await ending('空门之外','他找了一辈子没进去。你进去了。门后没有宝藏，只有风——和另一个正在找门的人。');
  if(hx===1){
   S.flags.dtKept=true;
   await ending('门匙在握','你记下了位置，把门留着。有些门，比进去更有用。');

 }

 /* —— 盗天真传 —— */
 if(hasMark('盗天真传')){
  await say('真传只有一句话：偷，是不必问的。你已经问过自己太多次。','gold');
  var zt=await optW('盗天真传·终局',[['承其偷道',40],['改其规矩',35],['封传不启',25]]);
  if(zt===0)await ending('偷道继声','你没有成为他。你只是让「不必问」多传了一代。');
  if(zt===1)await ending('有问之偷','你给偷加了一条规矩：只偷该被偷的。规矩很脆，你守了很久。');
  await ending('真传入匣','钥匙在，门不开。这个时代最干净的贼，是不再出手的贼。');
 }

 /* —— 招牌杀招线 —— */
 if(hasMove('无相手')&&hasMove('大盗鬼手')){

 if(hasMove('无相手')||hasMove('大盗鬼手')){

 if(hasMove('海阔天空')){

 if(hasMove('空穴一线')){

 if(hasMove('见面不相识')||hasMove('见面曾相识')){

 }
 if(hasMove('赌博蛊')){
  await ending('赌徒余烬','你把运气也当成可偷的东西。有一次，运气先偷了你。');
 }

 /* —— 关键道具 / 历练标记 —— */
 if(hasMark('遁空蛊')&&hasMark('推杯换盏蛊')){
  var tools=await optW('双蛊在手',[['继续寻门',45],['毁蛊弃门',30],['卖给后来人',25]]);
  if(tools===0)await ending('寻门人','门还没开。你把一辈子都用来找钥匙孔。');
